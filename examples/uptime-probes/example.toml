[example]
name = "uptime-probes"
title = "Uptime probes with no server"
summary = "Publish a scheduled probe and a status tool; a 503 target is marked down with down_since, a healthy one shows 100%."
use_case = ["uptime"]
clients = ["any"]
since = "0.59.3"
secrets_needed = []

[[tools]]
name = "probe"
kind = "python"
file = "tools/probe.py"
# Free-plan default. `network: "public"` (real outbound probes) is the
# `plan: pro` variant: a free tenant publishing it is refused with
# `plan_required`, so the recipe publishes `network: "none"` and the proof
# asserts the pipeline (rows, down_since) rather than live reachability.
network = "none"

[[tools]]
name = "status"
kind = "python"
file = "tools/status.py"

[first_call]
tool = "probe"
expect = "result.probed == 1"
