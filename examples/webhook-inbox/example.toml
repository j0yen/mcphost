[example]
name = "webhook-inbox"
title = "Webhook inbox in one call"
summary = "One host.webhook_inbox.create call returns a signed URL; a curl to it shows up in host.tool_call and host.msg.wait."
use_case = ["webhook"]
clients = ["any"]
since = "0.107.16"
secrets_needed = []
# The proof POSTs to the host's own public URL (a hairpin): it passes from
# orch / ryzen7 and is red when run from mcphost-1 itself.
runner = "orch-only"

[first_call]
tool = "host.webhook_inbox.create"
expect = "result.url contains https://"

[first_call.args]
name = "inbox"
