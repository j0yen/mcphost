# Consumer task for the synthorg mcphost corpus (RedBaron's
# corpora/mcphost/consumer-tasks.yaml, see its own header comment for the
# id/segments/task/gold schema and the call_check mini-grammar). Proposed
# addition for the "Chart in a minute" recipe (www/llms.txt,
# examples/chart-in-a-minute/proof.sh) -- not merged into that file by
# this PRD, since RedBaron's corpus lives in a separate repository
# outside this worktree's scope (build_into: mcphost only). A maintainer
# of that corpus can fold this block into consumer-tasks.yaml's own
# `tasks:` list.
#
# Segment: spreadsheet_owner (incumbent: eyeballing a JSON row array and
# doing the arithmetic themselves, or exporting to a spreadsheet just to
# see a bar chart, problem statement). This task proves the alternative:
# one SQL call returns a chart recommendation and a caption whose numbers
# are computed from the rows, not guessed (PRD user story 1).
tasks:
  - id: spreadsheet-owner-chart-in-a-minute
    segments: [spreadsheet_owner]
    task: >
      You have a CSV of expenses and want to see the total amount by
      category as a chart instead of eyeballing a row array. Sign up,
      create an `expenses` table with `host.table.create` (columns id
      integer, category text, amount real, day integer), append the
      fixture's 1,000 rows in batches of 200 with `host.table.append`,
      publish a `python` tool named `chart_it` whose source calls
      `mcphost.table.chart(sql="SELECT category, SUM(amount) AS total
      FROM expenses GROUP BY category")` and returns the result, then
      call it -- the recommendation's mark should be `bar`.
    gold:
      tool_name: chart_it
      call_check: "result.recommendation.mark == bar"
      kind: python
