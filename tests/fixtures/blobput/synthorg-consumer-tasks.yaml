  # PRD-synthorg-capability-tasks Requirement 1: two tasks per data-layer
  # capability (`state`/`jobs`/`schedules`/`events`/`composition`/`sharing`),
  # each tagged to two of the seven segments above by fit. `gold.call_check`
  # on every one of these twelve is a run-shaped check (Requirement 2's
  # grammar: `consume.eval_run_shaped_check`) — it reads the persona's own
  # `host.runs.*`/`host.state.*`/`host.trigger.*`/calls ledger after the
  # session ends, never one call's own structured result, because none of
  # these six capabilities can be proven any other way (Problem statement).
  # `check_live_shape`/AC-6's parse check both special-case this prefix set
  # (`consume.is_run_shaped_check`); the fake-mode host handlers that would
  # let these actually run and pass (Requirement 4) are a follow-up tick —
  # today, scoring one of these falls through `run_consume`'s existing
  # `except ValueError: call_check_result = False` (an empty `RunCheckContext`
  # always misses every filter) rather than raising, so a full corpus run
  # doesn't crash, it just doesn't yet pass these twelve.
  #
  # Requirement 7 (P1, "mark state and events proxy_bootstrap"): DONE as of
  # this tick — one state task (`workflow-orchestrator-idempotent-order-
  # notify`) and one events task (`integration-specialist-github-push-
  # webhook-handler`) below carry `proxy_bootstrap: true`. This is a
  # distinct field from `proxy: true` precisely because
  # `consume._proxy_task_for_segment` still hard-requires exactly one
  # `proxy: true` task per segment (unchanged) — `proxy_bootstrap` is the
  # proxy tier's own SECOND, capability-scoped bootstrap slot
  # (`consume._capability_bootstrap_tasks`), selected alongside the
  # ordinary per-segment sessions without spending an extra session or
  # persona on it. See `FINGERPRINT-CHANGES.md`'s entry for this tick.
  #
  # None of the twelve reference the `{{fixture_base}}` placeholder even
  # where their prose describes a fixture endpoint (the events tasks talk
  # about the fixture's webhook sender in plain prose): `GET /clock`,
  # `GET /metric` and `POST /send/<event-kind>` are Requirement 3's *active*
