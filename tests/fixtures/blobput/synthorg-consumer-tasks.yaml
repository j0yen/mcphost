# Hand-written consumer-task corpus for `synthorg consume` (PRD-mcphost-harness,
# rewritten by PRD-mcphost-consumer-corpus onto the mcp-host brief's real
# composition; gold checks and task prose rewritten again by
# PRD-mcphost-harness-live-gold Requirement 2 — see that PRD's note below,
# which supersedes this file's older "every check is a keyword from its own
# task id" description for every task except where noted).
#
# Each task is what one synthetic consumer session receives verbatim as its
# task, plus the gold signal `consume.py`'s scorer checks the session's
# recorded events against — never the session's own claims about how it
# went (Requirements P0 item 4).
#
#   id           unique task id, namespaced by segment (Requirement 12), e.g.
#                `rapid-prototyper-cold-start-scaffold`.
#   segments     which brief segment ids this task is written for; a
#                session is only ever assigned a task whose `segments`
#                includes its persona's own segment. Every id here is one of
#                the seven ids in `runs/mcp-host-project-discover/market/
#                panel-composition.yaml` — no task names a segment outside
#                that composition (AC-1).
#   task         the prose the consumer session receives as its task, in the
#                voice of that segment's own reported pain — never a pain the
#                evidence pack doesn't record (Requirement 3, Non-goals).
#   gold.tool_name   the tool the consumer is expected to publish and then
#                     call; must appear in `tools/list` after publishing.
#   gold.call_check  a predicate on the *structured result* of one
#                     `tools/call` to `tool_name` (see mini-grammar below).
#   gold.kind        the shipped mcphost `Kind` this task's tool is written
#                     against — `echo`, `http` or `python` (Requirement 4).
#                     Optional; defaults to `echo` when omitted, which is how
#                     `tests/fixtures/consume/consumer-tasks.yaml`'s older
#                     four-segment tasks (no `kind` key) keep validating.
#
# call_check mini-grammar (nothing upstream defines one, so it's specified
# here): "result.<dotted.path> <op> <value>", where <op> is one of
# `==`, `!=`, `contains`. `<dotted.path>` walks the structured call result
# (a plain JSON object) field by field; `<value>` is parsed as JSON when it
# parses (numbers/true/false/null/quoted strings), else taken as a bare
# string. `contains` checks substring membership for a string field, or
# item/key membership for a list/dict field. See `consume.eval_call_check`.
#
# Fake mode's in-process endpoint (`consume._build_fake_server`) answers
# every published tool with `{"status": "ok", "tool": <name>, "payload":
# <payload>}`, where `<payload>` is exactly the calling session's own task id
# (`_run_fake_consumer_session` calls the gold tool with `{"payload":
# task.id}`). `==`/`!=` checks against `result.status` or `result.tool` hold
# unconditionally under the fake handler; they stay in the grammar for a
# live-mode task whose real handler might disagree.
#
# PRD-mcphost-harness-live-gold Requirement 2: every `contains` check below
# now names the literal field a CORRECT tool's structured result must carry
# (e.g. `latency_ms`, `cost_usd`) — the task prose asks for that field
# explicitly, in these words, so the check is never a hidden trap (Open
# question, this PRD: "name it" was the default chosen). This makes each
# check satisfiable by a live http/python-kind tool that actually does what
# the task asked (Requirement 1's `_normalize_call_result` resolves
# `result.payload` to the tool's real body/return value) and unsatisfiable by
# one that merely returns 200 with unrelated content — `synthorg corpus check
# --live-shape` (Requirement 8 [P1]) proves both directions per task.
#
# Consequence for fake mode specifically: fake mode's handler (above) is
# generic and kind-unaware by design (Requirement 1: "no golden change from
# [normalisation] alone" — this PRD does not touch `_build_fake_server`), so
# its echoed `payload` (the task id string) only happens to contain a new
# field name where the two coincide (e.g. `error_trace_digest`'s
# `digest`); everywhere else, a fake-mode session's own `accuracy` is now
# 0.5 rather than the pre-this-PRD 1.0 — the check correctly stops being
# vacuously true under the generic echo, which is the point (Requirement 8's
# "fails when a check is unsatisfiable or vacuous"), not a regression.
# `corpus_fingerprint` changes accordingly; the first run under this corpus
# is a new baseline candidate (Requirement 2, Technical considerations).
#
# Evidence: every task cites, in a comment, the pack artifact its pain came
# from — either an opportunity-assessment candidate (PM synthesis over panel
# citations) or a panel persona file directly (`rag_indexer`,
# `workflow_orchestrator`, `data_pipeline_builder`, `cost_optimizer`,
# `admin_agent` have no opportunity-assessment candidate this cycle; their
# tasks cite the persona file's own pain paragraph instead — Open question:
# `workflow_orchestrator`'s population share printed `n/a` at n=2, but its
# persona-level pain is still pack-recorded, which is what a task's prose
# needs). Paths are relative to the repo root.
#
# `rag_indexer` and `data_pipeline_builder` deliberately get tasks a v0.3.0
# host can serve today — automatic embeddings and the Iceberg semantic layer
# stay out of scope (Non-goals); their pain is real but held back until a
# task actually fails for want of them.
tasks:
  # -- rapid_prototyper (incumbent: LangChain) --------------------------------
  - id: rapid-prototyper-cold-start-scaffold
    segments: [rapid_prototyper]
    # evidence: runs/mcp-host-project-discover/artifacts/2026-01-05/opportunity_assessment/opportunity-assessment-discover-candidate-0.md
    # ("30-45 minutes on environment setup, dependency wiring, and auth
    # config before they can validate whether their idea is even worth
    # pursuing"; panel_rapid_prototyper_03: "30-45 minutes on boilerplate
    # before I can test anything").
    task: >
      You had the idea for a new agent tool an hour ago, and you are not
      about to lose another 30-45 minutes to environment setup and
      dependency wiring before a single line proves anything. Sign up,
      publish a python-kind tool named `cold_start_scaffold` that stands a
      working tool up with no manual dependency resolution, and call it
      once to see whether this host actually clears the setup tax LangChain
      charges you every time — the result should include a `scaffold_status`
      field confirming the stand-up succeeded.
    gold:
      tool_name: cold_start_scaffold
      call_check: "result.payload contains scaffold_status"
      kind: python

  - id: rapid-prototyper-skip-boilerplate-glue
    segments: [rapid_prototyper]
    # evidence: runs/mcp-host-project-discover/artifacts/2026-01-05/opportunity_assessment/opportunity-assessment-discover-candidate-0.md
    # (panel_rapid_prototyper_01: "spending maybe 30% of prototype time
    # fighting dependency resolution, environment variable setup, and
    # gluing things together").
    task: >
      Roughly a third of your prototyping time disappears into dependency
      resolution, env-var setup, and gluing pieces together rather than
      building. Sign up, publish a python-kind tool named
      `skip_boilerplate_glue` that replaces one of those glue scripts
      outright, and call it once to see whether it actually gives that 30%
      back — the result should include a `boilerplate_removed` field naming
      what it replaced.
    gold:
      tool_name: skip_boilerplate_glue
      call_check: "result.payload contains boilerplate_removed"
      kind: python

  - id: rapid-prototyper-five-minute-wow
    segments: [rapid_prototyper]
    # PRD-mcphost-proxy-tier Requirement 1: this segment's bootstrap task —
    # gold.kind is echo (the cheapest, most reliable check) and the id
    # itself names the segment's own five-minute-wow pain.
    proxy: true
    # evidence: runs/mcp-host-project-discover/artifacts/2026-01-05/opportunity_assessment/opportunity-assessment-discover-candidate-0.md
    # ("On 5-minute trial: 100% said keep going (n=3). The trial moment is
    # the conversion moment.").
    task: >
      You give any new dev tool five minutes before deciding whether to
      keep going or close the tab. Sign up, publish a tool named
      `five_minute_wow` that proves this host earns its keep inside that
      window, and call it once before the five minutes are up — a plain
      `ok` status back is proof enough for this one.
    gold:
      tool_name: five_minute_wow
      call_check: "result.status == ok"
      kind: echo

  # -- rag_indexer (incumbent: LlamaIndex) ------------------------------------
  - id: rag-indexer-retrieval-latency-check
    segments: [rag_indexer]
    # PRD-mcphost-proxy-tier Requirement 1: this segment's bootstrap task —
    # no rag_indexer task matches gold.kind==echo or an id containing
    # five-minute/cold-start, so the first-listed task is the segment's
    # canonical bootstrap task (a documented, deterministic tie-break, not
    # a judgment about which pain matters most).
    proxy: true
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("Faster retrieval latency for their compliance-heavy use case
    # (sub-500ms response times critical)").
    task: >
      Your compliance-heavy retrieval workload needs sub-500ms responses,
      and LlamaIndex has felt increasingly sluggish as the document count
      grew. Sign up, publish a python-kind tool named
      `retrieval_latency_check` that reports how long one retrieval took,
      and call it once to see whether the number is one you could commit
      an SLA to — the result should include a `latency_ms` field.
    gold:
      tool_name: retrieval_latency_check
      call_check: "result.payload contains latency_ms"
      kind: python

  - id: rag-indexer-defaults-not-config-dialogs
    segments: [rag_indexer]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("Pain Points: Setup complexity disguised as flexibility... won't
    # tolerate more configuration dialogs dressed as flexibility"; FIVE_MINUTE_LOSS:
    # "requires manual embedding model selection or forces me to choose
    # between index types before showing automatic defaults").
    task: >
      You are done choosing between embedding models and chunk strategies
      before you've seen a single working default. Sign up, publish a
      python-kind tool named `defaults_not_config_dialogs` that returns a
      workable default configuration with no dialog to fill in first, and
      call it once to see whether it actually skips the choosing — the
      result should include a `default_config` field.
    gold:
      tool_name: defaults_not_config_dialogs
      call_check: "result.payload contains default_config"
      kind: python

  - id: rag-indexer-ingestion-source-status
    segments: [rag_indexer]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("scaling document ingestion across multiple formats has become
    # operationally messy — they've had to build custom preprocessing
    # pipelines").
    task: >
      Ingesting 50K+ documents a month across PDFs, Notion and internal
      databases has turned into custom preprocessing pipelines you'd rather
      not maintain. Sign up, publish an http-kind tool named
      `ingestion_source_status` that wraps
      `{{fixture_base}}/ingestion/sources/notion-docs/status` to report one
      source's ingestion status, and call it once to see if it is something
      you could actually monitor without hand-rolling more pipeline — the
      result should include an `ingestion_status` field.
    gold:
      tool_name: ingestion_source_status
      call_check: "result.payload contains ingestion_status"
      kind: http
    # PRD-synthorg-fixture-upstreams Requirement 4/AC-2: the
    # `synthorg.fixtures` route this task's `{{fixture_base}}` above
    # resolves to.
    fixture_route: /ingestion/sources/notion-docs/status

  - id: docs_qa_recipe
    segments: [rag_indexer]
    # PRD-mcphost-docs-qa-recipe (visions/mcphost-data-layer-first-slice.md;
    # wiki 2026-09-23-mcphost-market-test-plan: rag_indexer's own 61.8%
    # satisfaction baseline is the number this task exists to move). Unlike
    # this segment's other tasks above (which check that document-store
    # primitives exist), this one proves the persona can finish the "Docs
    # Q&A in a minute" recipe (mcphost's own examples/docs-qa/) end to end:
    # publish a search tool, ask a real question, get the right document
    # back — not just that a document got stored.
    task: >
      You do not trust a document store until it actually answers a
      question correctly. Sign up, publish an http-kind tool named
      `ask_docs` that wraps `{{fixture_base}}/docs/search/question-3` to
      search a small seeded corpus, and call it with the corpus's own third
      gold question ("What port does the VPN client connect on?") — the
      result's top 5 hits should include the document that actually answers
      it, `vpn-setup.md`.
    gold:
      tool_name: ask_docs
      call_check: "result.payload contains vpn-setup.md"
      kind: http
    # PRD-synthorg-fixture-upstreams Requirement 4/AC-2: the
    # `synthorg.fixtures` route this task's `{{fixture_base}}` above
    # resolves to.
    fixture_route: /docs/search/question-3
    # PRD-synthorg-recipe-tasks-panel-scored Requirement 2: this recipe's
    # own reference row in `measure.json`'s new `recipes.by_recipe`.
    recipe: mcphost-docs-qa-recipe

  # PRD-synthorg-docs-rag-tasks: five tasks whose gold checks a HOST-native
  # tool directly (`host.docs.*`/`host.table.describe`), never a tool the
  # persona publishes — unlike every rag_indexer task above, which checks a
  # persona-published wrapper. All five put/search/describe against the
  # shared eight-file fixture corpus at
  # `tests/fixtures/consume/docs/handbook/` (8 markdown files + `orders.csv`
  # + `gold.json`'s six questions) — the fake path's own scripted session
  # (`consume._run_docs_capability_script`) reads that folder straight off
  # disk and puts its content through the real `host.docs.*`/`host.table.*`
  # wire protocol, the same primitives `tests/fakedocs_ac*` already prove
  # against directly. Grounding: wiki 2026-09-23-mcphost-market-test-plan —
  # rag_indexer's own 61.8% satisfaction baseline is the number this set of
  # tasks (together with `docs_qa_recipe` above) exists to move; none of
  # the 39 tasks that predate this PRD stores or searches a document at all
  # (Problem statement).
  - id: docs-put-folder
    segments: [rag_indexer]
    capability: docs
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("scaling document ingestion... has become operationally messy").
    task: >
      You have a folder of eight handbook pages and want a document store
      that can just take the whole folder. Sign up, put all eight files
      from your handbook folder into the document store one at a time, and
      call the store's own status check to confirm every one of them
      landed — the status should report `documents: 8`.
    gold:
      tool_name: host.docs.status
      call_check: "result.documents == 8"
      kind: python

  - id: docs-wait-fresh
    segments: [rag_indexer]
    capability: docs
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("Faster retrieval latency... sub-500ms response times critical" —
    # this task is the honest flip side: a document is not searchable the
    # instant it is stored, and a tool that claims otherwise is lying).
    task: >
      A document you just put into the store should not be searchable
      before the index has actually caught up with it. Sign up, put one
      handbook page into the document store, then poll the store's own
      status check until it reports the index is fully caught up — the
      status should report `index.lag_seconds: 0`, not a stale answer
      given before the index was ready.
    gold:
      tool_name: host.docs.status
      call_check: "result.index.lag_seconds == 0"
      kind: python

  - id: docs-search-cite
    segments: [rag_indexer]
    capability: docs
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_01.md
    # ("I have a folder of markdown; make a tool that answers questions
    # with citations" — User stories).
    task: >
      A search that cannot name which document it answered from is not
      one you can trust. Sign up, put a couple of handbook pages into the
      document store (including `refunds.md`), wait for the index to
      catch up, then search for "refund window" — the top hit should name
      the document that actually answers it, `refunds.md`, not just
      return matching text with no citation.
    gold:
      tool_name: host.docs.search
      call_check: "result.results.0.name == refunds.md"
      kind: python

  - id: docs-update-stale
    segments: [rag_indexer]
    capability: docs
    # evidence: wiki 2026-09-23-mcphost-market-test-plan (rag_indexer's own
    # gap: a document store that silently serves stale answers after an
    # update is worse than one that admits it hasn't caught up yet).
    task: >
      When you edit a document, a search performed before the index
      catches up should honestly show the OLD version, never silently
      serve the new content it hasn't indexed yet and never crash. Sign
      up, put `refunds.md`, wait for it to be indexed, then update
      `refunds.md`'s content (bumping its version to 2) and search again
      right away, then poll status until the index has caught up and
      search once more — the final search's top hit should report
      `version: 2`.
    gold:
      tool_name: host.docs.search
      call_check: "result.results.0.version == 2"
      kind: python

  - id: table-describe-csv
    segments: [rag_indexer]
    capability: docs
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rag_indexer_03.md
    # ("processes 500K+ documents monthly across multiple data sources" —
    # tabular data is part of that same multi-format ingestion pain).
    task: >
      Half of what you need to answer questions about lives in a CSV, not
      a document. Sign up, load `orders.csv` into a table named `orders`,
      then describe the table to see whether it can tell you which column
      is the actual identifier — the description's own `primary_key`
      field should name it, `order_id`.
    gold:
      tool_name: host.table.describe
      call_check: "result.primary_key == order_id"
      kind: python

  # -- workflow_orchestrator (incumbent: LangGraph) ---------------------------
  - id: workflow-orchestrator-scheduling-visibility
    segments: [workflow_orchestrator]
    # PRD-mcphost-proxy-tier Requirement 1: this segment's bootstrap task —
    # no workflow_orchestrator task matches gold.kind==echo or an id
    # containing five-minute/cold-start; first-listed tie-break (see
    # rag-indexer-retrieval-latency-check's comment above).
    proxy: true
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_workflow_orchestrator_01.md
    # ("frustrated by... opaque task scheduling decisions when tools compete
    # for resources"; FIVE_MINUTE_LOSS: "cannot show her exactly which MCP
    # tool is blocking her workflow or consuming unexpected latency").
    task: >
      Your production workflow chains 4-8 MCP tools under a strict p99 < 2s
      SLA, and when something is slow you cannot tell which tool in the
      chain is actually blocking. Sign up, publish an http-kind tool named
      `scheduling_visibility` that wraps
      `{{fixture_base}}/scheduling/chains/checkout-flow` to name the tool
      currently holding up the chain, and call it once to see if you'd
      trust it at 3am — the result should include a `blocking_tool` field
      naming it.
    gold:
      tool_name: scheduling_visibility
      call_check: "result.payload contains blocking_tool"
      kind: http
    fixture_route: /scheduling/chains/checkout-flow

  - id: workflow-orchestrator-observability-retrofit
    segments: [workflow_orchestrator]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_workflow_orchestrator_01.md
    # ("frustrated by... the difficulty of retrofitting observability into
    # existing graphs").
    task: >
      Your LangGraph setup works, but bolting observability onto a graph
      you already built has been a fight every time. Sign up, publish a
      python-kind tool named `observability_retrofit` that attaches an
      observability hook to a running chain without rebuilding it, and call
      it once to see whether it actually retrofits cleanly — the result
      should include a `hook_attached` field.
    gold:
      tool_name: observability_retrofit
      call_check: "result.payload contains hook_attached"
      kind: python

  - id: workflow-orchestrator-error-trace-digest
    segments: [workflow_orchestrator]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_workflow_orchestrator_01.md
    # ("frustrated by... verbose error traces when a tool fails mid-chain").
    task: >
      When a tool fails mid-chain, LangGraph hands you a wall of trace you
      have to dig through before you know what actually broke. Sign up,
      publish a python-kind tool named `error_trace_digest` that turns one
      failed call's trace into a single actionable line, and call it once
      to see if it's faster than reading the raw trace yourself — the
      result should include a `digest` field.
    gold:
      tool_name: error_trace_digest
      call_check: "result.payload contains digest"
      kind: python

  # -- data_pipeline_builder (incumbent: dbt+Databricks) ----------------------
  - id: data-pipeline-builder-metric-definition-helper
    segments: [data_pipeline_builder]
    # PRD-mcphost-proxy-tier Requirement 1: this segment's bootstrap task —
    # no data_pipeline_builder task matches gold.kind==echo or an id
    # containing five-minute/cold-start; first-listed tie-break (see
    # rag-indexer-retrieval-latency-check's comment above).
    proxy: true
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_data_pipeline_builder_01.md
    # ("Her core frustration is the semantic layer gap... She spends cycles
    # writing boilerplate metric definitions instead of building pipelines").
    task: >
      You keep hand-writing boilerplate metric definitions because dbt is a
      transformation tool, not a semantic engine, and nothing self-serves
      against your Iceberg tables. Sign up, publish a python-kind tool
      named `metric_definition_helper` that drafts one metric definition
      from a table schema — not a whole semantic layer, just this one
      definition — and call it once to see if it actually cuts the
      boilerplate; the result should include a `metric_definition` field.
    gold:
      tool_name: metric_definition_helper
      call_check: "result.payload contains metric_definition"
      kind: python

  - id: data-pipeline-builder-fast-onboarding-check
    segments: [data_pipeline_builder]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_data_pipeline_builder_01.md
    # ("Alex runs tight sprints and doesn't have time for lengthy
    # evaluations. If a tool requires three weeks of setup, custom Spark
    # jobs... she's out.").
    task: >
      You run tight sprints and have no time for a three-week evaluation
      with custom Spark jobs bolted on. Sign up, publish a python-kind tool
      named `fast_onboarding_check` that proves it can be stood up in
      minutes against your existing warehouse, and call it once to see
      whether it actually skips the multi-week ramp — the result should
      include an `onboarding_minutes` field.
    gold:
      tool_name: fast_onboarding_check
      call_check: "result.payload contains onboarding_minutes"
      kind: python

  - id: data-pipeline-builder-warehouse-table-status
    segments: [data_pipeline_builder]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_data_pipeline_builder_01.md
    # ("Databricks is where her data lives; tight integration matters...
    # She'd consider switching only if onboarding felt painless").
    task: >
      Your warehouse is Databricks-on-Iceberg and it is not moving. Sign
      up, publish an http-kind tool named `warehouse_table_status` that
      wraps `{{fixture_base}}/warehouse/tables/main.risk.loan_applications`
      to report that table's status and row count without requiring you to
      migrate anything off Iceberg, and call it once to see if the
      integration is really as tight as promised — the result should
      include a `row_count` field.
    gold:
      tool_name: warehouse_table_status
      call_check: "result.payload contains row_count"
      kind: http
    fixture_route: /warehouse/tables/main.risk.loan_applications

  # -- integration_specialist (incumbent: n8n) --------------------------------
  - id: integration-specialist-rest-to-tool-bridge
    segments: [integration_specialist]
    # PRD-mcphost-proxy-tier Requirement 1: this segment's bootstrap task —
    # no integration_specialist task matches gold.kind==echo or an id
    # containing five-minute/cold-start; first-listed tie-break (see
    # rag-indexer-retrieval-latency-check's comment above).
    proxy: true
    # evidence: runs/mcp-host-project-discover/artifacts/2026-01-05/opportunity_assessment/opportunity-assessment-discover-candidate-3.md
    # ("Integration Specialists / Deployment-Tax-Free Agentic Workflow
    # Publishing").
    task: >
      You have 40+ production n8n workflows wired to REST APIs, and every
      new integration pays the same deployment tax before an agent can call
      it. Sign up, publish an http-kind tool named `rest_to_tool_bridge`
      that wraps `{{fixture_base}}/bridge/rest/orders-api` — turning that
      one REST endpoint into an agent-callable tool — and call it once to
      see if the deployment tax is actually gone — the result should
      include a `bridge_status` field.
    gold:
      tool_name: rest_to_tool_bridge
      call_check: "result.payload contains bridge_status"
      kind: http
    fixture_route: /bridge/rest/orders-api

  - id: integration-specialist-failure-diagnosis-log
    segments: [integration_specialist]
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_integration_specialist_01.md
    # ("Their biggest pain point isn't speed of initial setup; it's
    # diagnosing why a workflow failed at 2am. They need honest error
    # messages, execution logs they can actually read").
    task: >
      Your real pain isn't setup speed — it's diagnosing why a workflow
      failed at 2am with an error message that tells you nothing. Sign up,
      publish an http-kind tool named `failure_diagnosis_log` that wraps
      `{{fixture_base}}/diagnostics/calls/call-8842` to return a readable
      diagnosis of that failed call, and call it once to see if you could
      actually debug from it instead of guessing — the result should
      include a `diagnosis` field.
    gold:
      tool_name: failure_diagnosis_log
      call_check: "result.payload contains diagnosis"
      kind: http
