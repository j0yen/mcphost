  # IDENTICAL `segments` (`consume._validate_pair_tasks` refuses a mismatch)
  # — by convention (`consume._run_coordinate_pairs`), `segments[0]` is this
  # PAIR's own asker-side segment, `segments[1]` its responder-side segment,
  # for both halves alike. The asker's own `task` prose names
  # `{{partner_address}}`, resolved to the responder's own
  # `host.agent.whoami().address` before the asker's first turn
  # (Requirement 1/AC-3) — never a literal address, since which persona
  # plays the responder is decided per run, not per corpus edit. Gold is
  # `messages.count(...)` (Requirement 2's run-shaped grammar, extended by
  # this PRD) — asker gold needs an INBOUND reply from the responder whose
  # body carries the word the asker's own task prose asked for; responder
  # gold only needs to have SENT a reply at all (`host.msg.reply`), matching
  # the PRD's own wording: "responder gold on a `host.msg.reply` call in the
  # thread opened by the asker".

  - id: rapid-prototyper-nightly-index-freshness-ask
    segments: [rapid_prototyper, admin_agent]
    capability: coordinate
    # PRD-synthorg-gold-judge-reconciliation Requirement 4: messages.count(...) is a pre-existing capability grammar this PRD's
    # probe doesn't read back (Non-goals) — the truth tier skips this
    # task and --preflight doesn't flag it.
    fake_only: true
    pair:
      role: asker
      partner_task: admin-agent-nightly-index-freshness-answer
      pair_id: nightly-index-freshness
    # evidence: runs/mcp-host-project-discover/personas/panel/panel_rapid_prototyper_02.md
    # ("getting from idea to deployed link in under 30 minutes" — a
    # prototyper who needs a fast, trustworthy answer from whoever else on
    # this host actually owns the thing, not a dashboard to go dig through).
    task: >
      You are about to build on top of the `nightly_index` tool, and you
      need to know it is actually fresh before you do. You do not own it —
      someone else on this host does. Sign up, publish a python-kind tool
      named `index_freshness_gate`, look up the agent at address
      `{{partner_address}}`, and send it a message asking whether
      `nightly_index` was rebuilt — read the reply in the same thread and
      confirm it says `rebuilt`.
    gold:
      tool_name: index_freshness_gate
      call_check: 'messages.count(direction=inbound, from_partner=true, body_contains="rebuilt") >= 1'
      kind: python

