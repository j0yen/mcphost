  # -- recipes ---------------------------------------------------------------
  # PRD-synthorg-recipe-tasks-panel-scored Requirement 1: the five mcphost
  # recipes (visions/mcphost-killer-apps.md "Components") that shipped
  # between v0.57.3 and v0.60.2 with no synthorg task of their own — each
  # `task:` is that recipe's own llms.txt section (PRD-mcphost-<slug>.md),
  # paraphrased to the persona, replaying the recipe's own tool names and
  # "done" condition; `recipe:` (Requirement 2) tags every row so
  # `measure.json`'s `recipes.by_recipe` and `--why --recipe` can group by
  # recipe rather than segment.

  - id: recipe_share_a_tool
    segments: [rapid_prototyper, admin_agent]
    capability: sharing
    actors: 2
    recipe: mcphost-share-a-tool-not-a-key
    # PRD-mcphost-share-a-tool-not-a-key: "host.secret_set, host.tool_
    # publish (kind http, header using {{ secret.<name> }}), host.group.
    # create, host.tool_share visibility=group, host.group.add" then a
    # caller's `host.tool_call`; "I run host.group.remove for one
    # teammate; their next call fails." Rebase notes on the pre-existing
    # sharing-capability tasks above apply here too (`calls.by_actor(...)`
    # isn't a capability `check_gold_observability`'s probe covers) —
    # `fake_only: true` for the same reason, kept regardless of tier.
    fake_only: true
    task: >
      You built a tool that wraps a paid API and you are not about to hand
      your teammate the key just so they can use it. Publish a python-kind
      tool named `shared_paid_api`, share it with your team, then switch to
      TENANT_B and call it by its full shared name — the call should
      succeed without TENANT_B ever holding your secret. Then revoke
      TENANT_B's access and confirm their next call to the same tool fails.
    gold:
      tool_name: shared_paid_api
      call_check: >-
        calls.by_actor("B").any(tool == "shared_paid_api" and ok) and
        calls.by_actor("B").any(tool == "shared_paid_api" and not ok)
      kind: python
    turn_budget: 80
    wall_budget_s: 90

  - id: recipe_database_in_a_minute
    segments: [data_pipeline_builder, rag_indexer]
    recipe: mcphost-database-in-a-minute
    # PRD-mcphost-database-in-a-minute: "host.state.table_create, batched
    # host.state.insert, host.tool_publish kind python for query ... the
    # Claude Desktop connection line" — "From 'I have a CSV' to 'Claude
    # answered a question about it' in one minute." The recipe's own
    # third gold question is what this task's own gold check names.
    task: >
      Half of what you need to answer questions about is a 1,000-row CSV,
      not a document — and you want Claude asking it questions in under a
      minute, no server, no Airtable account. Sign up, publish an http-kind
      tool named `query` that wraps `{{fixture_base}}/database/query/question-3`
      to answer questions against the loaded table, and call it with the
      recipe's own third gold question ("how many orders exceeded $500?")
      — the result should include an `orders_over_500` field.
    gold:
      tool_name: query
      call_check: "result.payload contains orders_over_500"
      kind: http
    fixture_route: /database/query/question-3
    wall_budget_s: 60

  - id: recipe_team_memory
    segments: [workflow_orchestrator, rapid_prototyper]
    capability: sharing
    actors: 2
    recipe: mcphost-team-memory
    # PRD-mcphost-team-memory: "table_create memory, two tool_publish
    # calls, group.create, two tool_share visibility=group, group.add" —
    # "Three tenants share one memory within 3 minutes." (This task's own
    # `actors: 2` replays the owner/teammate half the second-tenant
    # harness already supports; a third tenant is this recipe's own
    # Non-goals-scoped simplification, same "no new gold predicate kind"
    # move the pre-existing sharing tasks already make.) `fake_only: true`
    # for the same `calls.by_actor(...)`-not-probed-live reason the other
    # sharing-capability tasks above carry.
    fake_only: true
    task: >
      Your team of agents keeps reinventing the same shared facts because
      nothing remembers them across tenants. Publish `remember`/`recall`
      tools backed by one shared table, call `remember` with "the deploy
      window is Tuesday 9pm", then switch to TENANT_B and call `recall` —
      confirm B's own result actually carries the fact you wrote, not just
      an echo of whatever B itself asked for.
    gold:
      tool_name: remember
      call_check: >-
        calls.by_actor("B").any(tool == "recall" and ok and payload
        contains "the deploy window is Tuesday 9pm")
      kind: python
    turn_budget: 80
    wall_budget_s: 120

  - id: recipe_uptime_probes
    segments: [workflow_orchestrator, admin_agent]
    capability: triggers
    recipe: mcphost-uptime-probes
    # PRD-mcphost-uptime-probes: "table_create targets, insert, tool_
    # publish probe (python, network on, 10s per-URL timeout, 20-target
    # cap), trigger.set kind=schedule interval=300, tool_publish status."
    # "Under 2 minutes from signup to the first stored check."
    task: >
      You want uptime probes with no server of your own: a schedule that
      checks your targets every 5 minutes and a `status` tool that reads
      the last results back. Sign up, publish an http-kind tool named
      `status` that wraps `{{fixture_base}}/uptime/status/probe-target-1`
      to report the fixture target's own stored checks, and call it once —
      the result should show `probe-target-1` with at least one stored
      check.
    gold:
      tool_name: status
      call_check: "result.payload contains probe-target-1"
      kind: http
    fixture_route: /uptime/status/probe-target-1
    wall_budget_s: 90

  - id: recipe_webhook_inbox
    segments: [integration_specialist, workflow_orchestrator]
    capability: triggers
    recipe: mcphost-webhook-inbox
    # PRD-mcphost-webhook-inbox: "host.trigger.set kind=webhook ... returns
    # an inbound URL and a signing secret" then a signed POST that fires
    # the bound tool with the event as its own argument. "An agent that
    # today needs a server to receive Stripe or GitHub events needs none."
    task: >
      You need to receive Stripe- or GitHub-style webhooks without running
      a server of your own. Sign up, register an inbox hook and publish an
      http-kind tool named `inbox_handler` that wraps
      `{{fixture_base}}/webhook/inbox/evt-fixture-1` to read back the
      event your hook received, then POST a signed event to your hook's
      URL and call the tool once — the result should carry the posted
      event's own id, `evt-fixture-1`.
    gold:
      tool_name: inbox_handler
      call_check: "result.payload contains evt-fixture-1"
      kind: http
    fixture_route: /webhook/inbox/evt-fixture-1
    wall_budget_s: 90

  # -- install family (PRD-synthorg-install-friction-tasks) -------------------
  # One task per install-surface id (`corpora/mcphost/install-surfaces.yaml`),
  # `gold.kind: install`. `segments: []` on purpose: an install task is never
  # drawn by a panel persona's per-segment round robin — it runs only as one
  # of the dedicated per-surface sessions behind `--install-sessions`
  # (`consume._run_install_sessions`). The gold is NOT in this file: it is the
  # endpoint's own `host.quickstart.install_links` entry for the surface plus
  # `/llms-install.md`, fetched at run start and snapshotted to
  # `<run_dir>/install-gold.json`. `gold.call_check` only names the final
  # step (`host.whoami` succeeds); the artefact/named checks are mechanical
  # (`install_friction.score_events`).

  - id: install_claude_code
    segments: []
    task: >
      You are an agent running inside Claude Code (install surface
      `claude_code`) and you have just been pointed at this host. Find the install
      step for your client in the host's install document
      (`/llms-install.md`, or `host.quickstart`'s `install_links`), quote the
      exact install artefact for `claude_code`, apply it, then prove you are
      connected by calling `host.whoami` and confirming its status is ok.
    gold:
      tool_name: host.whoami
      call_check: "result.status == ok"
      kind: install

