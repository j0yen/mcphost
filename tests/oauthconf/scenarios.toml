# Scenario gold for PRD-mcphost-oauth-conformance-harness.
#
# `name` is unique and stable (used as the join key by `docs/oauth-scenarios.md`
# and by `mcphost oauth-probe --scenario <name>`). `family` groups scenarios
# for AC1's per-family assertion; `owner_prd` is the feature PRD that makes
# this scenario read `pass` -- "unassigned" until some future PRD claims it
# (goal 3: "every OAuth PRD in this fleet names the scenarios it flips from
# `unsupported` to `pass`"). `steps` documents the client-simulator steps
# (`src/oauthclient.rs`) the scenario's own runner exercises, in order.
# `expected` is the gold verdict this PRD's own tree must produce today --
# never `fail` (a committed scenario that's expected to fail the host isn't
# gold, it's a bug report).
#
# Every family other than `prm`/`iss` reads `unsupported` on this tree: the
# shared generic runner (`src/oauthclient.rs::run_generic_probe`) has no
# family-specific arm for register/authorize/token/attack probes yet, so it
# always stops unsupported past `read_as_metadata` -- including once
# `mcphost-hosted-authorization-server` landed and `read_as_metadata` itself
# started passing (this host now has its own AS metadata document). `prm`
# and `iss` need no authorization server at
# all: `prm` is RFC 9728 protected-resource discovery (already implemented,
# `src/oauth.rs::protected_resource_metadata`), and `iss` is the resource
# server's own issuer-identity enforcement (RFC 9207's mix-up-attack
# defense, already implemented in `validate_bearer`'s issuer lookup) --
# neither one is gated on an authorize/token endpoint existing.

[[scenario]]
name = "prm_root_discovery"
family = "prm"
owner_prd = "mcphost-oauth-resource-server"
steps = ["discover_401", "read_prm"]
expected = "pass"

[[scenario]]
name = "iss_unknown_issuer_rejected"
family = "iss"
owner_prd = "mcphost-oauth-resource-server"
steps = ["iss_check"]
expected = "pass"

[[scenario]]
name = "dcr_registration_without_as_metadata"
family = "dcr"
owner_prd = "unassigned"
steps = ["discover_401", "read_prm", "read_as_metadata", "register"]
expected = "unsupported"

