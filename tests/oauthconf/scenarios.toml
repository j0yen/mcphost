[[scenario]]
name = "step_up_403_without_as_metadata"
family = "step_up"
# PRD-mcphost-tool-scopes-and-consent AC3: this family's own runner
# (`oauthclient::run_step_up_probe`) self-signs-up a synthetic probe
# tenant, publishes a `write`-scoped tool, and drives the full step-up
# sequence -- a 403 `insufficient_scope` on the under-scoped call, then a
# re-authorization with the union scope, then success -- for real.
#
# PRD-mcphost-implicit-signup: `run_step_up_probe` short-circuits on its
# own leading `discover_401` step (same root-`/mcp` probe as
# `prm_root_discovery` above), which now reads `Unsupported` for the same
# reason -- root `/mcp` no longer refuses the bare, unauthenticated call
# `discover_401` sends. The real step-up mechanism this family proves is
# unaffected (toolscope_ac03's own end-to-end test signs up for real and
# still passes); only this harness probe's bootstrap assumption broke.
# Flipped from `pass`/`mcphost-tool-scopes-and-consent` back to
# `unsupported`/`unassigned` to match.
owner_prd = "unassigned"
steps = ["discover_401", "read_prm", "read_as_metadata", "register", "authorize", "consent", "token", "call", "step_up"]
expected = "unsupported"

