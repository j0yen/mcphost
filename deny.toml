# deny.toml — supply-chain policy for autobuilder-scaffolded projects.
# Run: cargo deny check

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0316", reason = "inherited: wasmtime 46.0.3 pinned on main since e1dfd22, not touched by this branch; delta-pass c1854a27 (run 300); fix = bump wasmtime >=48.0.3, tracked as main gate-debt" },
  { id = "RUSTSEC-2026-0314", reason = "inherited: wasmtime-wasi 46.0.3 pinned on main since e1dfd22, not touched by this branch; delta-pass c1854a27 (run 300); fix = bump wasmtime-wasi >=48.0.3, tracked as main gate-debt" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # Crates that have caused real-world soundness or supply-chain incidents,
  # or whose usage is a strong smell in any new project.
  { crate = "openssl", reason = "use rustls; avoid native OpenSSL dependency unless absolutely required" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
