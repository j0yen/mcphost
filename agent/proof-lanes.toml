# proof-lanes.toml — change-class → required-lane routing.
# READ-ONLY after scaffold. The edit-agent must NOT modify this.
#
# Lifted shape from jankurai/agent/proof-lanes.toml. Each lane has a set of
# globs that route to it. A Stage-3 advance requires every changed path to
# resolve to ≥1 lane AND that lane's required_command must be green.

[[lane]]
id = "rust-source"
description = "Behavior changes in src/"
globs = ["src/**/*.rs"]
required_commands = [
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[[lane]]
id = "infer-data"
description = "Compile-time data embedded into src/kinds/infer.rs via include_str! (python stdlib/import-map JSON). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for infer-data/ either (same gap class as the meta lane below), and these files gate rust-source behavior identically to a .rs edit."
globs = ["infer-data/**"]
required_commands = [
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[[lane]]
id = "rust-tests"
description = "Test-only changes (only allowed via intent-card amendment). .config/nextest.toml folded in 2026-09-12 (PRD-mcphost-test-suite-consolidation): it only configures how the existing test suite runs (JUnit output location/timing), same proof as a tests/**/*.rs edit -- same gap class as every other 'no lane matched a new config-adjacent path' fix already documented in this file."
globs = ["tests/**/*.rs", ".config/nextest.toml"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "deps"
description = "Cargo.toml / Cargo.lock changes"
globs = ["Cargo.toml", "Cargo.lock"]
required_commands = [
  "cargo check --workspace",
  "cargo deny check",
]

[[lane]]
id = "ci"
description = "GitHub Actions workflow changes"
globs = [".github/workflows/**"]
required_commands = [
  "scripts/audit.sh",
]

[[lane]]
id = "db-migrations"
description = "Numbered SQLite migration files (requirement 7 -- applied at `mcphost migrate` and at `serve` start). Added project-locally: the shipped scaffold template has no lane for migrations/ either (same gap class as the meta lane below)."
globs = ["migrations/**"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "meta"
description = "Orchestrator-owned scaffold metadata (agent/** intent-card, program doc, owner/test maps, this file) and repo hygiene (.gitignore). Not edit-agent-owned (see owner-map.json); no build proof applies, only intent-card schema validation. Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for agent/** or .gitignore, which unroutes every Stage 2 scaffold commit's own agent/ files -- fold back via postmortem. server.json (the MCP registry publish manifest, PRD-mcphost-registry-publish) folded in here 2026-09-06 for the same reason: static metadata with no build proof beyond schema validity. .buildloop/ci-equivalent.toml (PRD-build-main-push-gate requirement 7) folded in here 2026-09-16 (gate-debt 4f1112d, vti-plan finding): same gap class -- build-skill-owned config consumed by main-push-gate.sh outside this repo, not edit-agent-owned, with no build proof beyond the schema/intent-card checks this lane already runs."
globs = ["agent/**", ".gitignore", "CHANGELOG.md", "README.md", "LICENSE-*", "extended-gates.toml", "PRD-*.md", "rules/**", "scripts/gate-status.sh", "server.json", ".burst-lane.toml", ".buildloop/**"]
required_commands = [
  "autobuilder intake --validate agent/intent-card.json",
  "cargo test --workspace revdebt_ac1_intent_card_pointers_resolve::",
]
note = "cargo test line added by PRD-mcphost-reviewer-debt-paydown (AC6/AC7, requirement 5): a card-only edit (this lane's own glob set) previously routed to schema validation alone, so a future partial intent-card refresh that reintroduced a stale AC `test` pointer or a card/traceability-receipt prd_path mismatch would have shipped silently -- the schema validator has no opinion on either. tests/revdebt_ac1_intent_card_pointers_resolve.rs is the pointer proof; it must run whenever agent/** changes, not only when tests/**/*.rs changes. PRD-mcphost-test-suite-consolidation (2026-09-12): the file no longer IS its own cargo test binary (it's `#[path]`-included into one of a handful of tests/suite_*.rs binaries by scripts/gen-test-suites.sh, keyed by filename prefix), so this line filters by test-name substring across `--workspace` instead of naming a `--test <binary>` -- that stays correct regardless of which suite the generator's bucketing puts the file in on a future regeneration."

[[lane]]
id = "deploy"
description = "Operator-facing systemd unit files shipped alongside the crate (PRD-mcphost-metered-overage AC9: deploy/mcphost-emit-meter.{service,timer}). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for deploy/** either (same gap class as db-migrations and infer-data above). Proof is `systemd-analyze verify`, matching the PRD's own acceptance criterion, not a cargo command."
globs = ["deploy/**"]
required_commands = [
  "systemd-analyze verify deploy/mcphost-emit-meter.service deploy/mcphost-emit-meter.timer",
]

[[lane]]
id = "ci-scripts"
description = "Shell scripts that drive .github/workflows/ci.yml but live outside it (PRD-mcphost-ci-sandbox-coverage AC6: scripts/ci-test-partition.sh; scripts/gen-test-suites.sh folded in 2026-09-12, PRD-mcphost-test-suite-consolidation -- it drives the same CI test-discovery surface as ci-test-partition.sh, generating the tests/suite_*.rs files ci-test-partition.sh's own partition reads). Added project-locally: same gap class as the ci lane's own workflow-file globs, which never covered scripts/ that ci.yml merely invokes."
globs = ["scripts/ci-test-partition.sh", "scripts/gen-test-suites.sh"]
required_commands = [
  "scripts/audit.sh",
]

[[lane]]
id = "www"
description = "Static marketing/legal site served alongside the API (index/terms/privacy/aup/llms.txt). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for www/** either (same gap class as db-migrations, infer-data and deploy above) -- the www-redesign commits' 5 changed paths (www/index.html, www/terms.html, www/privacy.html, www/aup.html, www/llms.txt) were unrouted, blocking PRD-mcphost-healthz-minimal's vti-plan gate receipt though they were not part of that PRD's own diff. No JS build tooling or HTML linter exists in this repo (no node/npm, no tidy/xmllint on the build host), so proof is scripts/www-check.sh: a minimal Python-stdlib (html.parser) check that each www/*.html file is valid UTF-8, non-empty, and parses without error, and that llms.txt is valid non-empty UTF-8 text. Not a style/accessibility linter -- an honest floor, not a fake pass."
globs = ["www/**", "scripts/www-check.sh", "scripts/listings-check.sh", "scripts/listings-submit.sh", "deploy/listings/**"]
required_commands = [
  "scripts/www-check.sh",
]

[[lane]]
id = "docs"
description = "Prose documentation under docs/ (per-kind reference docs, receipts write-ups). Added project-locally 2026-09-07 (PRD-mcphost-healthz-minimal's vti-plan gap fix): docs/kinds/*.md and docs/receipts/*.md were unrouted, blocking the vti-plan gate receipt though they were not part of that PRD's own diff -- same gap class as the www lane above. scripts/www-check.sh (the www lane's own proof script) was unrouted for the same reason and is folded into that lane's globs above instead of here, since it belongs conceptually with www/. No markdown linter exists in this repo (no node/npm, no markdownlint on the build host), so proof is scripts/docs-check.sh: a minimal Python-stdlib check that each docs/kinds/*.md and docs/receipts/*.md file is valid, non-empty UTF-8 text. Not a style/prose linter -- an honest floor, not a fake pass. Fixed 2026-09-07 (/build tick): scripts/docs-check.sh itself was unrouted -- the same bootstrapping gap the www lane had already folded its own www-check.sh script into -- blocking vti-plan for six mcphost PRDs (mcphost-tool-test, mcphost-metered-overage, mcphost-python-kind-runtime, mcphost-ci-sandbox-coverage, mcphost-healthz-minimal, mcphost-rest-bridge, build-extend-gate-receipts) on a path none of their diffs touched; folded scripts/docs-check.sh into this lane's own globs."
globs = ["docs/kinds/**", "docs/receipts/**", "scripts/docs-check.sh", "docs/agent-quickstart.md", "docs/benchmarks/**", "scripts/gen-agent-docs.sh", "scripts/gen-llms-full.sh", "scripts/copy-claims.sh"]
required_commands = [
  "scripts/docs-check.sh",
]

[[lane]]
id = "harness-readonly"
description = "Harness files; should never change after scaffold"
globs = [
  "scripts/run-metrics.sh",
  "scripts/audit.sh",
  "scripts/risk-gate.sh",
  "clippy.toml",
  "deny.toml",
  "rust-toolchain.toml",
]
required_commands = [
  "exit 1",
]
note = "Any change to a harness-readonly path fails the gate. Use an intent-card amendment to legitimately modify."

[[lane]]
id = "loop-config"
description = "The build loop's own CI-equivalent config for main-push-gate.sh's delta check (PRD-build-main-push-gate's CI-equivalent contract, .buildloop/ci-equivalent.toml). Added project-locally (PRD-mcphost-proof-lane-loop-config): same gap class as every other unrouted-top-level-path fix already documented in this file, except this one blocked vti-plan on EVERY branch (inherited=2 in-scope=0) rather than just the branch that happened to touch the path, since the file landed on main via the loop's own push-gate PRD rather than through a branch that could carry its own lane fix."
globs = [".buildloop/**"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "examples"
description = "Example recipes under examples/** whose behavior is proven by the mcphost_share_a_tool_not_a_key_ac*/mcphost_team_memory_ac*/mcphost_database_in_a_minute_ac*/mcphost_uptime_probes_ac* integration tests that spawn them (examples/share-a-tool/proof.sh, examples/share-a-tool/synthorg-task.yaml; examples/team-memory/proof.sh, examples/team-memory/tools/*.py, examples/team-memory/synthorg-task.yaml; examples/database-in-a-minute/proof.sh, examples/database-in-a-minute/fixture.csv, examples/database-in-a-minute/tools/*.py, examples/database-in-a-minute/synthorg-task.yaml; examples/uptime-probes/proof.sh, examples/uptime-probes/tools/*.py, examples/uptime-probes/synthorg-task.yaml). Added project-locally (PRD-mcphost-share-a-tool-not-a-key); examples/team-memory/** folded in 2026-09-21 (PRD-mcphost-team-memory); examples/database-in-a-minute/** and examples/uptime-probes/** folded in 2026-09-22 (PRD-mcphost-database-in-a-minute, PRD-mcphost-uptime-probes), same gap class as infer-data/db-migrations/deploy/www/docs above -- the shipped scaffold's proof-lanes.toml has no lane for examples/, and these files gate the AC0x tests identically to a tests/**/*.rs edit, so proof is a name-filtered cargo test run over the tests that actually exercise them rather than the whole rust-tests lane."
globs = ["examples/share-a-tool/**", "examples/team-memory/**", "examples/database-in-a-minute/**", "examples/uptime-probes/**"]
required_commands = [
  "cargo test --workspace mcphost_share_a_tool_not_a_key_ac",
  "cargo test --workspace mcphost_team_memory_ac",
  "cargo test --workspace mcphost_database_in_a_minute_ac",
  "cargo test --workspace mcphost_uptime_probes_ac",
]

[[lane]]
id = "wasm-fixtures"
description = "Wasm-kind test fixtures under tests/fixtures/wasm-src/** (guest component sources) and tests/fixtures/wasm/** (their compiled .wasm binaries), whose behavior is proven by the wasmkind_ac0x integration tests that load and call them. Added project-locally (PRD-mcphost-wasm-kind): same gap class as the examples lane above -- the shipped scaffold's proof-lanes.toml has no lane for these paths, and they gate the AC0x tests identically to a tests/**/*.rs edit, so proof is a name-filtered cargo test run over the tests that actually exercise them rather than the whole rust-tests lane."
globs = ["tests/fixtures/wasm-src/**", "tests/fixtures/wasm/**"]
required_commands = [
  "cargo test --workspace wasmkind_ac",
]

[[lane]]
id = "contracts"
description = "The committed host.*/billing.* tool-surface contract (contracts/host-tools.v1.json, generated by `mcphost contract dump`) and its deprecation ledger (contracts/deprecations.json), whose behavior is proven by the mcphost_host_tool_deprecation_ac0x integration tests. Added project-locally (PRD-mcphost-host-tool-deprecation): same gap class as the examples/wasm-fixtures lanes above -- the shipped scaffold's proof-lanes.toml has no lane for contracts/, and these files gate the AC0x tests identically to a tests/**/*.rs edit, so proof is a name-filtered cargo test run over the tests that actually exercise them rather than the whole rust-tests lane."
globs = ["contracts/**"]
required_commands = [
  "cargo test --workspace mcphost_host_tool_deprecation_ac",
]

[[lane]]
id = "admin-schemas"
description = "The committed admin.tenants/admin.usage row-shape contract (schemas/admin/tenants.v1.json, schemas/admin/usage.v1.json), whose behavior is proven by the mcphost_admin_schema_contract_ac0x integration tests. Added project-locally (PRD-mcphost-admin-schema-contract): same gap class as the contracts/examples/wasm-fixtures lanes above -- the shipped scaffold's proof-lanes.toml has no lane for schemas/, and these files gate the AC0x tests identically to a tests/**/*.rs edit, so proof is a name-filtered cargo test run over the tests that actually exercise them rather than the whole rust-tests lane."
globs = ["schemas/**"]
required_commands = [
  "cargo test --workspace mcphost_admin_schema_contract_ac",
]

[[lane]]
id = "checkcompat-race-soak"
description = "Soak-test driver script for PRD-mcphost-checkcompat-port-race AC5 (scripts/checkcompat-race-soak.sh): loops `cargo test checkcompat -- --test-threads=32` to force the thread-count concurrency AC5's port-collision race needs, well past what a single run would surface. Added project-locally: same gap class as the examples/wasm-fixtures lanes above -- the shipped scaffold's proof-lanes.toml has no lane for project-local soak scripts under scripts/, and this one is exercised by (not itself part of) the checkcompat race tests, so proof is a name-filtered cargo test run over those tests rather than the whole rust-tests lane."
globs = ["scripts/checkcompat-race-soak.sh"]
required_commands = [
  "cargo test --workspace checkcompat",
]

[[lane]]
id = "plugin"
description = "PRD-mcphost-claude-code-plugin-and-snippets: the static Claude Code plugin (plugin/.claude-plugin/plugin.json, plugin/.mcp.json, plugin/skills/mcphost/SKILL.md) and its own asset-check script (tests/plugin_assets.sh, AC1). Added project-locally: same gap class as www/docs/deploy above -- the shipped scaffold's proof-lanes.toml has no lane for plugin/, and tests/plugin_assets.sh is a shell script, not a tests/**/*.rs file, so it falls outside the rust-tests lane's glob. The AC2-9 behavior itself (JSON/markdown content, no build step) is proven by cargo -- covered by the pre-existing rust-tests lane since those live in tests/*.rs -- so this lane's own required command is tests/plugin_assets.sh, matching the www lane's self-contained-check-script pattern."
globs = ["plugin/**", "tests/plugin_assets.sh"]
required_commands = [
  "tests/plugin_assets.sh",
]
