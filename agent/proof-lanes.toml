# proof-lanes.toml — change-class → required-lane routing.
# READ-ONLY after scaffold. The edit-agent must NOT modify this.
#
# Lifted shape from jankurai/agent/proof-lanes.toml. Each lane has a set of
# globs that route to it. A Stage-3 advance requires every changed path to
# resolve to ≥1 lane AND that lane's required_command must be green.

[[lane]]
id = "rust-source"
description = "Behavior changes in src/"
globs = ["src/**/*.rs"]
required_commands = [
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[[lane]]
id = "infer-data"
description = "Compile-time data embedded into src/kinds/infer.rs via include_str! (python stdlib/import-map JSON). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for infer-data/ either (same gap class as the meta lane below), and these files gate rust-source behavior identically to a .rs edit."
globs = ["infer-data/**"]
required_commands = [
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[[lane]]
id = "rust-tests"
description = "Test-only changes (only allowed via intent-card amendment). .config/nextest.toml folded in 2026-09-12 (PRD-mcphost-test-suite-consolidation): it only configures how the existing test suite runs (JUnit output location/timing), same proof as a tests/**/*.rs edit -- same gap class as every other 'no lane matched a new config-adjacent path' fix already documented in this file."
globs = ["tests/**/*.rs", ".config/nextest.toml"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "deps"
description = "Cargo.toml / Cargo.lock changes"
globs = ["Cargo.toml", "Cargo.lock"]
required_commands = [
  "cargo check --workspace",
  "cargo deny check",
]

[[lane]]
id = "ci"
description = "GitHub Actions workflow changes"
globs = [".github/workflows/**"]
required_commands = [
  "scripts/audit.sh",
]

[[lane]]
id = "db-migrations"
description = "Numbered SQLite migration files (requirement 7 -- applied at `mcphost migrate` and at `serve` start). Added project-locally: the shipped scaffold template has no lane for migrations/ either (same gap class as the meta lane below)."
globs = ["migrations/**"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "meta"
description = "Orchestrator-owned scaffold metadata (agent/** intent-card, program doc, owner/test maps, this file) and repo hygiene (.gitignore). Not edit-agent-owned (see owner-map.json); no build proof applies, only intent-card schema validation. Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for agent/** or .gitignore, which unroutes every Stage 2 scaffold commit's own agent/ files -- fold back via postmortem. server.json (the MCP registry publish manifest, PRD-mcphost-registry-publish) folded in here 2026-09-06 for the same reason: static metadata with no build proof beyond schema validity."
globs = ["agent/**", ".gitignore", "CHANGELOG.md", "README.md", "LICENSE-*", "extended-gates.toml", "PRD-*.md", "rules/**", "scripts/gate-status.sh", "server.json", ".burst-lane.toml"]
required_commands = [
  "autobuilder intake --validate agent/intent-card.json",
  "cargo test --workspace revdebt_ac1_intent_card_pointers_resolve::",
]
note = "cargo test line added by PRD-mcphost-reviewer-debt-paydown (AC6/AC7, requirement 5): a card-only edit (this lane's own glob set) previously routed to schema validation alone, so a future partial intent-card refresh that reintroduced a stale AC `test` pointer or a card/traceability-receipt prd_path mismatch would have shipped silently -- the schema validator has no opinion on either. tests/revdebt_ac1_intent_card_pointers_resolve.rs is the pointer proof; it must run whenever agent/** changes, not only when tests/**/*.rs changes. PRD-mcphost-test-suite-consolidation (2026-09-12): the file no longer IS its own cargo test binary (it's `#[path]`-included into one of a handful of tests/suite_*.rs binaries by scripts/gen-test-suites.sh, keyed by filename prefix), so this line filters by test-name substring across `--workspace` instead of naming a `--test <binary>` -- that stays correct regardless of which suite the generator's bucketing puts the file in on a future regeneration."

[[lane]]
id = "deploy"
description = "Operator-facing systemd unit files shipped alongside the crate (PRD-mcphost-metered-overage AC9: deploy/mcphost-emit-meter.{service,timer}). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for deploy/** either (same gap class as db-migrations and infer-data above). Proof is `systemd-analyze verify`, matching the PRD's own acceptance criterion, not a cargo command."
globs = ["deploy/**"]
required_commands = [
  "systemd-analyze verify deploy/mcphost-emit-meter.service deploy/mcphost-emit-meter.timer",
]

[[lane]]
id = "ci-scripts"
description = "Shell scripts that drive .github/workflows/ci.yml but live outside it (PRD-mcphost-ci-sandbox-coverage AC6: scripts/ci-test-partition.sh; scripts/gen-test-suites.sh folded in 2026-09-12, PRD-mcphost-test-suite-consolidation -- it drives the same CI test-discovery surface as ci-test-partition.sh, generating the tests/suite_*.rs files ci-test-partition.sh's own partition reads). Added project-locally: same gap class as the ci lane's own workflow-file globs, which never covered scripts/ that ci.yml merely invokes."
globs = ["scripts/ci-test-partition.sh", "scripts/gen-test-suites.sh"]
required_commands = [
  "scripts/audit.sh",
]

[[lane]]
id = "www"
description = "Static marketing/legal site served alongside the API (index/terms/privacy/aup/llms.txt). Added project-locally: the shipped scaffold template's proof-lanes.toml has no lane for www/** either (same gap class as db-migrations, infer-data and deploy above) -- the www-redesign commits' 5 changed paths (www/index.html, www/terms.html, www/privacy.html, www/aup.html, www/llms.txt) were unrouted, blocking PRD-mcphost-healthz-minimal's vti-plan gate receipt though they were not part of that PRD's own diff. No JS build tooling or HTML linter exists in this repo (no node/npm, no tidy/xmllint on the build host), so proof is scripts/www-check.sh: a minimal Python-stdlib (html.parser) check that each www/*.html file is valid UTF-8, non-empty, and parses without error, and that llms.txt is valid non-empty UTF-8 text. Not a style/accessibility linter -- an honest floor, not a fake pass."
globs = ["www/**", "scripts/www-check.sh", "scripts/listings-check.sh", "scripts/listings-submit.sh", "deploy/listings/**"]
required_commands = [
  "scripts/www-check.sh",
]

[[lane]]
id = "docs"
description = "Prose documentation under docs/ (per-kind reference docs, receipts write-ups). Added project-locally 2026-09-07 (PRD-mcphost-healthz-minimal's vti-plan gap fix): docs/kinds/*.md and docs/receipts/*.md were unrouted, blocking the vti-plan gate receipt though they were not part of that PRD's own diff -- same gap class as the www lane above. scripts/www-check.sh (the www lane's own proof script) was unrouted for the same reason and is folded into that lane's globs above instead of here, since it belongs conceptually with www/. No markdown linter exists in this repo (no node/npm, no markdownlint on the build host), so proof is scripts/docs-check.sh: a minimal Python-stdlib check that each docs/kinds/*.md and docs/receipts/*.md file is valid, non-empty UTF-8 text. Not a style/prose linter -- an honest floor, not a fake pass. Fixed 2026-09-07 (/build tick): scripts/docs-check.sh itself was unrouted -- the same bootstrapping gap the www lane had already folded its own www-check.sh script into -- blocking vti-plan for six mcphost PRDs (mcphost-tool-test, mcphost-metered-overage, mcphost-python-kind-runtime, mcphost-ci-sandbox-coverage, mcphost-healthz-minimal, mcphost-rest-bridge, build-extend-gate-receipts) on a path none of their diffs touched; folded scripts/docs-check.sh into this lane's own globs."
globs = ["docs/kinds/**", "docs/receipts/**", "scripts/docs-check.sh", "docs/agent-quickstart.md", "docs/benchmarks/**", "scripts/gen-agent-docs.sh", "scripts/gen-llms-full.sh", "scripts/copy-claims.sh"]
required_commands = [
  "scripts/docs-check.sh",
]

[[lane]]
id = "harness-readonly"
description = "Harness files; should never change after scaffold"
globs = [
  "scripts/run-metrics.sh",
  "scripts/audit.sh",
  "scripts/risk-gate.sh",
  "clippy.toml",
  "deny.toml",
  "rust-toolchain.toml",
]
required_commands = [
  "exit 1",
]
note = "Any change to a harness-readonly path fails the gate. Use an intent-card amendment to legitimately modify."
