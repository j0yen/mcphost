# Which CI jobs back which wm-build gate producers (CI-as-gate). Job names are
# the check-run names GitHub reports; branch protection keys on them too.
# Checked by `wm-build gate ci-map --check <repo>`.

[[ci_covers]]
producer = "msrv-verify"
workflow = "ci.yml"
jobs = ["msrv check (builds with the declared rust-version toolchain)"]

[[ci_covers]]
producer = "flake-lint"
workflow = "ci.yml"
jobs = ["flake-lint (env-mutation, single-shot-perf, receipt-read)"]

[[ci_covers]]
producer = "flake-audit"
workflow = "ci.yml"
jobs = [
  "static analysis + core suites",
  "sandbox suites (user namespaces, shard 1/2)",
  "sandbox suites (user namespaces, shard 2/2)",
]

[[ci_covers]]
producer = "determinism"
workflow = "ci.yml"
jobs = ["determinism (two cold release builds, identical artifact sha256)"]

# Host-side gate checks (wm-build `[[check]]`, read by gate/repo_ci.rs): the two CI
# steps that blocked gates 692/693/711 on 2026-10-11 ONLY after a 40-min CI round
# trip (flake-audit ci-job-failure). Run them in the gate in seconds instead.
[[check]]
name = "test-partition"
cmd = "./scripts/ci-test-partition.sh check"
where = "host"
wall_minutes = 10

# 2026-10-13: runs 764/765 went CI-red after a green gate on hand-kept pin assertions only CI ran.
[[check]]
name = "pin-tests"
cmd = "./scripts/pin-tests.sh"
where = "host"
wall_minutes = 45  # warm 24 s (suites built by the inner); a cold tree (hand-rebased wt) measured 40 min on a loaded host 10-13 12:4x am

[[check]]
name = "bad-rust-audit"
cmd = "./scripts/audit.sh"
where = "host"
wall_minutes = 10
