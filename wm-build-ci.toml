# Which CI jobs back which wm-build gate producers (CI-as-gate). Job names are
# the check-run names GitHub reports; branch protection keys on them too.
# Checked by `wm-build gate ci-map --check <repo>`.

[[ci_covers]]
producer = "msrv-verify"
workflow = "ci.yml"
jobs = ["msrv check (builds with the declared rust-version toolchain)"]

[[ci_covers]]
producer = "flake-lint"
workflow = "ci.yml"
jobs = ["flake-lint (env-mutation, single-shot-perf, receipt-read)"]

[[ci_covers]]
producer = "flake-audit"
workflow = "ci.yml"
jobs = [
  "static analysis + core suites",
  "sandbox suites (user namespaces, shard 1/3)",
  "sandbox suites (user namespaces, shard 2/3)",
  "sandbox suites (user namespaces, shard 3/3)",
]

[[ci_covers]]
producer = "determinism"
workflow = "ci.yml"
jobs = ["determinism (two cold release builds, identical artifact sha256)"]

# Host-side gate checks (wm-build `[[check]]`, read by gate/repo_ci.rs): the two CI
# steps that blocked gates 692/693/711 on 2026-10-11 ONLY after a 40-min CI round
# trip (flake-audit ci-job-failure). Run them in the gate in seconds instead.
[[check]]
name = "test-partition"
cmd = "./scripts/ci-test-partition.sh check"
where = "host"
wall_minutes = 10

# 2026-10-13: runs 764/765 went CI-red after a green gate on hand-kept pin assertions only CI ran.
# 2026-10-13 8:1x am: the cargo pins moved out of the gate -- three gates in a row spent 20-31 min
# compiling three test binaries cold, and run 772 was blocked by this check while the same script
# passed all 6 pins by hand on the same tree. The gate keeps the cargo-free drift checks (seconds);
# scripts/pin-tests.sh stays for the inner (run it before `done`) and for hand verification.
[[check]]
name = "pin-tests"
cmd = "./scripts/pin-tests.sh --cargo-free"
where = "host"
wall_minutes = 5

# PRD-mcphost-contract-suite-generated: the contract tests (`//! contract:`-marked files,
# routed by gen-test-suites.sh into tests/suite_contracts_*.rs) run in the inner and the gate
# before CI. The run list is derived from Cargo.toml by the script itself (`--list`), so this
# check and CI's `contract suites` step cannot drift from the tree.
[[check]]
name = "contract-suite"
cmd = "./scripts/pin-tests.sh"
where = "host"
wall_minutes = 25  # 10-16 r7: was 10; ryzen7 prechecks 265 and 323 died exit 124 at the 10-min wall (suite alone 313-583 s; 573-583 s under contention)

[[check]]
name = "bad-rust-audit"
cmd = "./scripts/audit.sh"
where = "host"
wall_minutes = 10
receipt = "target/autobuilder/receipts/risk-gate.json"
fail_marker = "audit: BLOCKING"
