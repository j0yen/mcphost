#     --out deploy/listings/launch/panel-run \
#     --test-variants deploy/listings/launch/variants.yaml --only-test
#
# Deliberately avoids the two claims copy-claims.sh and the gtm Critic both
# rejected ("under five minutes" — untested against real p95 latency; "the
