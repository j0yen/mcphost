- id: smithery
  name: Smithery
  method: form
  check_kind: text-search
  check_url: https://smithery.ai/server/j0yen/mcphost
  search_text: mcphost.dev
  artifact: deploy/listings/forms/smithery.md
  submitted: null
  notes: >
    URL slug is a guess pending real submission. Site is a client-rendered
    SPA that returns 200 with a generic app shell for any /servers/<slug>
    path (the shell even echoes the requested slug into a login-redirect
    link), so a bare "mcphost" substring search false-positives on every
    unlisted slug too -- search_text is mcphost.dev (only present in
    real, server-rendered listing content) to avoid that. Verified
    2026-09-08: page has no mcphost.dev, streamable-http, or other
    listing-specific content -- genuinely not listed.

