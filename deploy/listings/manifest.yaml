# deploy/listings/manifest.yaml — PRD-mcphost-agent-findability P0#2.
#
# One entry per place an agent (or its operator) might look for mcphost.
# scripts/listings-check.sh reads this file and probes `check_url` against
# the live web; scripts/listings-submit.sh reads it to prepare (and, only
# under PUBLISH-OK, execute) each submission.
#
# Fields:
#   id            stable slug, used in ledger lines and CLI output
#   name          human-readable target name
#   method        pr | form | api — how a listing gets created there
#   check_kind    registry-json (parses the official registry's JSON,
#                 compares the `version` field to CURRENT_VERSION) |
#                 text-search (fetches check_url, looks for search_text)
#   check_url     URL listings-check.sh fetches
#   search_text   only for check_kind: text-search — substring that proves
#                 mcphost is listed
#   artifact      path (relative to repo root) to the prepared submission
#                 file — the PR branch content or the form payload text
#   submitted     ISO date this entry was actually submitted, or null;
#                 written by listings-submit.sh under PUBLISH-OK, never
#                 hand-edited
#   notes         free text
#
# Directory URLs below (smithery/glama/pulsemcp/mcp.so) are the slugs
# mcphost *should* resolve to once listed, guessed from each site's public
# URL convention — none of the four has mcphost listed yet (verified
# 2026-09-08: 308/301/403/404 respectively), so these are placeholders a
# human corrects at actual submission time, not confirmed listing URLs.

- id: registry
  name: Official MCP Registry
  method: api
  check_kind: registry-json
  check_url: https://registry.modelcontextprotocol.io/v0/servers?search=mcphost
  artifact: server.json
  submitted: "2026-09-06"
  notes: >
    Published as dev.mcphost/mcphost under the grand-loop PUBLISH-OK grant
    (~/repos/PRDs/grand-loop/PUBLISH-OK); republished by mcphost-deploy's
    redeploy reconcile (PRD-mcphost-listing-freshness) whenever the
    deployed version changes. Verified 2026-09-08: registry shows 0.14.0
    against a locally-checked-out 0.27.0 — reconcile has not run since;
    that gap is what makes this entry `stale` today.

