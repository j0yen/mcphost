[package]
name = "mcphost"
version = "0.37.0"
edition = "2024"
rust-version = "1.88"
description = "One MCP endpoint an agent can join and administer without a human"
license = "MIT OR Apache-2.0"
authors = ["j0yen <hello@mcphost.dev>"]

[lib]
name = "mcphost"
path = "src/lib.rs"

[[bin]]
name = "mcphost"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
# AC19 / requirement 15: host.registry_publish POSTs a tenant's server.json
# to the configured registry API base URL at runtime, not just in tests.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
minijinja = { version = "2.24.0", features = ["json", "urlencode"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# PRD-mcphost-code-tools: `src/sandbox.rs`'s pre_exec rlimits (setrlimit),
# process-group signalling (killpg/setsid) and `/proc` resource sampling.
libc = "0.2"
serde_path_to_error = "0.1.20"

[features]
# PRD-mcphost-classify-precision: gates PythonKind's test-only selftest
# constructor/setters (`for_test_with_selftest`,
# `set_selftest_interpreter_for_test`, `set_selftest_missing_binary_for_test`)
# so they're unreachable from an ordinary `cargo build`/default-features
# consumer of this lib. `cfg(test)` alone hides them from `tests/*.rs`
# integration tests too (those link the lib built *without* `--cfg test`),
# so this feature is what those tests enable instead -- see the
# self-referential `[dev-dependencies]` entry below. Must never be pulled
# in by `default` (the existing supply-chain audit denies that).
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1"
# AC19: mocks the registry API in tests/ac19_registry_publish.rs (the
# fleet's standard HTTP-mock crate).
wiremock = "0.6"
# Self-dependency (standard Cargo idiom): enables `test-support` only for
# the lib crate integration tests (`tests/*.rs`) link against, without
# leaking it into `default` for ordinary consumers/binaries.
mcphost = { path = ".", features = ["test-support"] }
