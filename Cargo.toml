[package]
name = "mcphost"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One MCP endpoint an agent can join and administer without a human"
license = "MIT OR Apache-2.0"
authors = ["Joe Yen <jyen.tech@gmail.com>"]

[lib]
name = "mcphost"
path = "src/lib.rs"

[[bin]]
name = "mcphost"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full", "test-util"] }
