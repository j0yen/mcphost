# PRD-mcphost-chart-in-a-minute AC1: without this table, the five
# `vendor/*` path dependencies below are ordinary library deps of an
# implicit single-package workspace -- `cargo test --workspace -p
# mqo-chart-vocab` (the gate's own invocation shape, see
# agent/proof-lanes.toml / .buildloop/ci-equivalent.toml) errors "not
# found in workspace" and their `#[cfg(test)]` modules never compile.
# Listing them as explicit members makes `cargo test --workspace` /
# `cargo clippy --workspace` actually cover them.
[workspace]
members = [
    ".",
    "vendor/mqo-chart-vocab",
    "vendor/mqo-result-profiler",
    "vendor/mqo-chart-recommender",
    "vendor/mqo-vega-emitter",
    "vendor/mqo-chart-caption",
]

[profile.release]
strip = true

[package]
autotests = false  # gen-test-suites.sh: explicit [[test]] suites below
name = "mcphost"
version = "0.82.0"
edition = "2024"
rust-version = "1.95"
description = "One MCP endpoint an agent can join and administer without a human"
license = "MIT OR Apache-2.0"
authors = ["j0yen <hello@mcphost.dev>"]

[lib]
name = "mcphost"
path = "src/lib.rs"

[[bin]]
name = "mcphost"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
# PRD-mcphost-inbound-events P0 requirement 2: GitHub's legacy
# `X-Hub-Signature` scheme is HMAC-SHA1 -- same RustCrypto family as `sha2`
# above, added rather than hand-rolling SHA-1 (unlike the from-scratch
# HMAC-SHA256 in `billing.rs`, SHA-1's own compression function is enough
# code that reusing an audited crate beats duplicating it).
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
# AC19 / requirement 15: host.registry_publish POSTs a tenant's server.json
# to the configured registry API base URL at runtime, not just in tests.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
minijinja = { version = "2.24.0", features = ["json", "urlencode"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# PRD-mcphost-code-tools: `src/sandbox.rs`'s pre_exec rlimits (setrlimit),
# process-group signalling (killpg/setsid) and `/proc` resource sampling.
libc = "0.2"
serde_path_to_error = "0.1.20"
# PRD-mcphost-tenant-tables P0 requirement 2: `host.table.query`'s
# structural (parse-level, not string-matching) rejection of non-SELECT and
# multi-statement SQL -- a real AST parser rather than a hand-rolled
# prefix/keyword check, the same "don't hand-roll what a crate already gets
# right" call `sha1` above makes for HMAC-SHA1.
sqlparser = "0.62"
# PRD-mcphost-wasm-kind requirement 2: the `wasm` kind's execution engine --
# a library, not a subprocess, so isolation travels with the compiled
# component instead of depending on the host's userns/bwrap/AppArmor policy
# (the vision's cycle-53 caveat this PRD exists to answer). Pinned to a
# specific release (recorded in `/healthz` via `kinds::wasm::WASM_RUNTIME_VERSION`)
# rather than a floating range, matching this crate's other embedded-runtime
# dependencies.
wasmtime = "48.0.4"
# A conforming component built by the expected guest toolchain
# (`cargo component build` against `wasm32-wasip1`/`wasip2`) links wasi:cli
# imports (exit/environment) even for pure-compute code, purely as an
# artifact of the Rust std allocator's OOM-abort path -- non-goal 4 rules
# out wasi:sockets/wasi:http specifically, not WASI altogether, so this
# links wasi:cli/clocks/random with stdio piped to in-memory buffers (no
# preopened directories, no inherited network) rather than trying to keep
# every realistic guest binary import-free.
wasmtime-wasi = "48.0.4"
# A wasm component is supplied at publish time as a base64 string field in
# the spec JSON (the same transport python's `source` field already uses for
# text, per this PRD's technical considerations) -- needed only to decode it.
base64 = "0.22"
# PRD-mcphost-tenant-data-export P0 requirement 1: `host.export`'s archive
# is a real `.tar.gz` -- unlike the small hand-rolled encodings elsewhere in
# this crate (ULIDs, RFC 3339, HMAC-SHA256), a correct tar layout plus DEFLATE
# framing/CRC32 is enough surface that reusing audited crates beats
# duplicating it, the same call `sha1` above already made for HMAC-SHA1.
tar = "0.4"
flate2 = "1"
# PRD-mcphost-oauth-resource-server requirement 4: bearer-JWT signature
# (RS256/ES256) and claim validation against a tenant-registered issuer's
# JWKS -- an audited crate rather than hand-rolled RSA/EC signature
# verification, the same "reuse audited crypto" call `sha1`/`aes-gcm` above
# already make.
jsonwebtoken = "9"
# PRD-mcphost-hosted-authorization-server requirement 5: generates this
# host's own ES256 authorization-server signing key (PKCS8 DER, so
# `jsonwebtoken::EncodingKey::from_ec_der` loads it directly) and derives
# the matching public JWK's x/y coordinates -- already resolved transitively
# via `jsonwebtoken`'s default `ring` crypto backend (see Cargo.lock), so
# this is a direct dependency on a crate already fully vetted by this
# graph, not a new one.
ring = "0.17"
# PRD-mcphost-oauth-conformance-harness requirement 2: `tests/oauthconf/
# scenarios.toml` (the scenario gold table) is embedded into the release
# binary via `include_str!` so `mcphost oauth-probe` can read it without the
# source tree being present on a deployed box -- moved here (was
# dev-dependencies-only, pinned for `lanecov`'s proof-lanes.toml parser)
# since that now needs to compile into `src/`, not just `tests/`.
toml = "0.8"
# PRD-mcphost-chart-in-a-minute P0 requirement 1 (AC1): ai-stack's
# grammar-free chart chain, vendored unchanged under vendor/<crate> as path
# dependencies -- see vendor/VENDOR.md for source repo/commit. `src/chart.rs`
# is the one piece mcphost writes itself: a `result-profile.v1` profiler over
# `host.table.query` rows (ai-stack's own profiler reads an MQO response
# instead, which mcphost has none of).
mqo-chart-vocab = { path = "vendor/mqo-chart-vocab", version = "0.1.0" }
mqo-result-profiler = { path = "vendor/mqo-result-profiler", version = "0.1.0" }
mqo-chart-recommender = { path = "vendor/mqo-chart-recommender", version = "0.1.0" }
mqo-vega-emitter = { path = "vendor/mqo-vega-emitter", version = "0.1.0" }
mqo-chart-caption = { path = "vendor/mqo-chart-caption", version = "0.1.0" }

[features]
# PRD-mcphost-classify-precision: gates PythonKind's test-only selftest
# constructor/setters (`for_test_with_selftest`,
# `set_selftest_interpreter_for_test`, `set_selftest_missing_binary_for_test`)
# so they're unreachable from an ordinary `cargo build`/default-features
# consumer of this lib. `cfg(test)` alone hides them from `tests/*.rs`
# integration tests too (those link the lib built *without* `--cfg test`),
# so this feature is what those tests enable instead -- see the
# self-referential `[dev-dependencies]` entry below. Must never be pulled
# in by `default` (the existing supply-chain audit denies that).
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1"
# AC19: mocks the registry API in tests/ac19_registry_publish.rs (the
# fleet's standard HTTP-mock crate).
wiremock = "0.6"
# PRD-mcphost-oauth-resource-server: tests/support/oauth.rs generates its
# ES256 test keypairs at process start (a secrets scanner correctly
# blocks embedded PEM private keys, test-only or not) instead of hardcoding
# them. Pinned exact: its default features already select the `ring`
# crypto backend and `pem` serialization, both of which resolve to the
# same `ring`/`pem` versions `jsonwebtoken` above already pulls in --
# 0.14.10 bumps its `pem` requirement to a second, unshared major version.
rcgen = "=0.14.9"
# PRD-mcphost-proof-lane-loop-config AC2: tests/lanecov_ac01_every_tracked_
# path_routes.rs parses agent/proof-lanes.toml and compiles its globs with
# the SAME crates autobuilder's vti-plan uses (autobuilder/Cargo.toml pins
# the same versions) -- a test-only matcher that disagreed with vti-plan's
# own would be worse than no test at all. `toml` itself moved to
# [dependencies] (PRD-mcphost-oauth-conformance-harness) but stays listed
# here implicitly via that promotion -- no separate dev-dependencies entry
# needed now that the main dependency covers `tests/*.rs` too.
globset = "0.4"
# AC8: www/status.html is a static file only mcphost-deploy's Caddy ever
# serves, so no headless browser sits in this test harness -- boa_engine
# (pure-Rust JS engine, no C toolchain/browser needed on the runner box)
# lets tests/statusfeed_ac08_status_html_renders.rs actually execute the
# page's inline <script> against a mocked `document`/`fetch`, instead of
# grepping the committed markup and hoping the runtime behavior matches.
boa_engine = "0.22.0"
# Self-dependency (standard Cargo idiom): enables `test-support` only for
# the lib crate integration tests (`tests/*.rs`) link against, without
# leaking it into `default` for ordinary consumers/binaries.
mcphost = { path = ".", features = ["test-support"] }

