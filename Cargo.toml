[package]
autotests = false  # gen-test-suites.sh: explicit [[test]] suites below
name = "mcphost"
version = "0.60.3"
edition = "2024"
rust-version = "1.94"
description = "One MCP endpoint an agent can join and administer without a human"
license = "MIT OR Apache-2.0"
authors = ["j0yen <hello@mcphost.dev>"]

[lib]
name = "mcphost"
path = "src/lib.rs"

[[bin]]
name = "mcphost"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
# PRD-mcphost-inbound-events P0 requirement 2: GitHub's legacy
# `X-Hub-Signature` scheme is HMAC-SHA1 -- same RustCrypto family as `sha2`
# above, added rather than hand-rolling SHA-1 (unlike the from-scratch
# HMAC-SHA256 in `billing.rs`, SHA-1's own compression function is enough
# code that reusing an audited crate beats duplicating it).
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
# AC19 / requirement 15: host.registry_publish POSTs a tenant's server.json
# to the configured registry API base URL at runtime, not just in tests.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
minijinja = { version = "2.24.0", features = ["json", "urlencode"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# PRD-mcphost-code-tools: `src/sandbox.rs`'s pre_exec rlimits (setrlimit),
# process-group signalling (killpg/setsid) and `/proc` resource sampling.
libc = "0.2"
serde_path_to_error = "0.1.20"
# PRD-mcphost-tenant-tables P0 requirement 2: `host.table.query`'s
# structural (parse-level, not string-matching) rejection of non-SELECT and
# multi-statement SQL -- a real AST parser rather than a hand-rolled
# prefix/keyword check, the same "don't hand-roll what a crate already gets
# right" call `sha1` above makes for HMAC-SHA1.
sqlparser = "0.62"
# PRD-mcphost-wasm-kind requirement 2: the `wasm` kind's execution engine --
# a library, not a subprocess, so isolation travels with the compiled
# component instead of depending on the host's userns/bwrap/AppArmor policy
# (the vision's cycle-53 caveat this PRD exists to answer). Pinned to a
# specific release (recorded in `/healthz` via `kinds::wasm::WASM_RUNTIME_VERSION`)
# rather than a floating range, matching this crate's other embedded-runtime
# dependencies.
wasmtime = "46.0.3"
# A conforming component built by the expected guest toolchain
# (`cargo component build` against `wasm32-wasip1`/`wasip2`) links wasi:cli
# imports (exit/environment) even for pure-compute code, purely as an
# artifact of the Rust std allocator's OOM-abort path -- non-goal 4 rules
# out wasi:sockets/wasi:http specifically, not WASI altogether, so this
# links wasi:cli/clocks/random with stdio piped to in-memory buffers (no
# preopened directories, no inherited network) rather than trying to keep
# every realistic guest binary import-free.
wasmtime-wasi = "46.0.3"
# A wasm component is supplied at publish time as a base64 string field in
# the spec JSON (the same transport python's `source` field already uses for
# text, per this PRD's technical considerations) -- needed only to decode it.
base64 = "0.22"
# PRD-mcphost-tenant-data-export P0 requirement 1: `host.export`'s archive
# is a real `.tar.gz` -- unlike the small hand-rolled encodings elsewhere in
# this crate (ULIDs, RFC 3339, HMAC-SHA256), a correct tar layout plus DEFLATE
# framing/CRC32 is enough surface that reusing audited crates beats
# duplicating it, the same call `sha1` above already made for HMAC-SHA1.
tar = "0.4"
flate2 = "1"

[features]
# PRD-mcphost-classify-precision: gates PythonKind's test-only selftest
# constructor/setters (`for_test_with_selftest`,
# `set_selftest_interpreter_for_test`, `set_selftest_missing_binary_for_test`)
# so they're unreachable from an ordinary `cargo build`/default-features
# consumer of this lib. `cfg(test)` alone hides them from `tests/*.rs`
# integration tests too (those link the lib built *without* `--cfg test`),
# so this feature is what those tests enable instead -- see the
# self-referential `[dev-dependencies]` entry below. Must never be pulled
# in by `default` (the existing supply-chain audit denies that).
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1"
# AC19: mocks the registry API in tests/ac19_registry_publish.rs (the
# fleet's standard HTTP-mock crate).
wiremock = "0.6"
# PRD-mcphost-proof-lane-loop-config AC2: tests/lanecov_ac01_every_tracked_
# path_routes.rs parses agent/proof-lanes.toml and compiles its globs with
# the SAME crates autobuilder's vti-plan uses (autobuilder/Cargo.toml pins
# the same versions) -- a test-only matcher that disagreed with vti-plan's
# own would be worse than no test at all.
toml = "0.8"
globset = "0.4"
# Self-dependency (standard Cargo idiom): enables `test-support` only for
# the lib crate integration tests (`tests/*.rs`) link against, without
# leaking it into `default` for ordinary consumers/binaries.
mcphost = { path = ".", features = ["test-support"] }

