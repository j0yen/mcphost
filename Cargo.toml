path = "tests/suite_core_02.rs"

[[test]]
name = "suite_core_03"
path = "tests/suite_core_03.rs"

[[test]]
name = "suite_core_04"
path = "tests/suite_core_04.rs"

[[test]]
name = "suite_core_05"
path = "tests/suite_core_05.rs"

[[test]]
name = "suite_core_06"
path = "tests/suite_core_06.rs"

[[test]]
name = "suite_core_07"
path = "tests/suite_core_07.rs"

[[test]]
name = "suite_sandbox_01"
path = "tests/suite_sandbox_01.rs"

[[test]]
