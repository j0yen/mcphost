[project]
name = "mcphost-sdk"
version = "0.108.122"
description = "Typed Python client for mcphost, generated from the host's tool contract"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcphost_sdk"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
