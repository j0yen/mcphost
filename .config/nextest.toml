# nextest.toml -- PRD-mcphost-test-suite-consolidation P1 requirement 57.
#
# JUnit output with per-test timing, so a later gate-phase-timing PRD can
# split the `gate` phase into per-test time without re-instrumenting
# anything here. `store-success-output = false` keeps the JUnit file from
# growing unbounded with captured stdout for the (overwhelming majority of)
# passing tests; failures still carry their output for debugging.
[store]
dir = "target/nextest"

# Per-test terminator (503 five-whys MECH2a, 2026-10-28): a parked test fails NAMED
# after period x terminate-after (10 min) instead of hanging the caller silently.
# Every nextest caller inherits this (coder loops, future gate runner, orch archive runner).
[profile.default]
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
