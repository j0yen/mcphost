name: ci

# The contexts a PR must pass are GENERATED from this file into
# .github/required-checks.toml by scripts/required-checks.sh --generate
# (a job, rename or matrix change here needs the regenerated toml committed).

on:
  push:
    # 10-10: wm-build pushes each gate's tree to wm-build/gate/<slug> before
    # reading CI-backed receipts by sha; no PR is involved for that ref.
    branches: [main, "autobuilder/**", "wm-build/gate/**"]
  pull_request:
  # Merge queue: a required queue builds each entry on a gh-readonly-queue/*
  # ref and waits for every required context on THAT commit. Without this
  # trigger the queued entry has no checks and stalls. Same for registry.yml.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 10-10: only PR runs cancel superseded ones; main-push runs must finish so
  # wm-build 0.75.1 can read base-sha receipts from them (a cancelled main run
  # = base-ci-cancelled = local rerun of every CI-backed producer).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/wm-build/gate/') }}

# PRD-mcphost-ci-sandbox-coverage AC6 (P1). `gate` and `sandbox` declare no
# `needs:` on each other, so GitHub schedules them concurrently and the
# workflow's wall time is max(gate, sandbox) rather than their sum. That is
# the AC's second branch ("or the suites run as a parallel job"), taken
# because its first branch is now measurably out of reach: with the sandbox
# suites executing for real instead of skipping, the single `cargo test
# --workspace` step measured 336s (v0.13.1, run 33955331814) and 313s (v0.13.3,
# run 33995726792), both over the PRD's own 300s budget.
#
# That first split was not enough on its own: even isolated as its own job,
# the sandbox partition's `cargo test` step alone measured 313s -- over budget
# by itself. So `sandbox` is a matrix (`strategy.matrix.shard`) whose width
# is NOT written here: the `plan` job runs `scripts/ci-test-partition.sh
# shards` (its one SANDBOX_SHARDS definition, PRD-mcphost-ci-sandbox-shards-
# balanced) and emits the matrix and the job-name total; each shard runs
# `scripts/ci-test-partition.sh sandbox-shard <n> <total>`, and
# `sandbox-required` gates on every shard succeeding so a shard failure still
# fails the workflow instead of being silently ignored (GitHub does not fail
# a run just because one matrix job failed unless something depends on it).
#
# Which targets go to which job is DERIVED, not listed here -- see
# `scripts/ci-test-partition.sh`. All jobs run that script's `check` before
# testing (total + disjoint over `tests/*.rs`, AND total + disjoint over the
# sandbox shards) and assert zero capability-skips afterwards, so a target
# filed into the wrong job/shard turns CI red instead of skipping silently.
# Only `sandbox` grants the userns capability; a userns-dependent target left
# in `gate` therefore skips, and `gate`'s own assertion fails the job.
jobs:
  # The sandbox shard count lives in scripts/ci-test-partition.sh only; this
  # job turns it into the matrix `sandbox` expands (a literal count in this
  # file fails tests/cishard_ac02_*). Only `sandbox` needs it, so `gate` and
  # the shards still start together once this seconds-long job is done.
  plan:
    name: sandbox shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: derive the sandbox shard matrix
        id: plan
        run: |
          shards=$(./scripts/ci-test-partition.sh shards)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix={\"shard\":$(seq 1 "$shards" | jq -sc .)}" >> "$GITHUB_OUTPUT"

  gate:
    name: static analysis + core suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: install rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.10.1

      - name: install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny@0.20.2

      - name: cargo check
        run: cargo check --locked --workspace

      - name: cargo clippy
        run: cargo clippy --locked --workspace -- -D warnings

      # Kept identical to the sandbox job's environment except for the userns
      # grant: the only intended difference between the two jobs is the
      # capability, not which binaries exist.
      - name: install bubblewrap and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: verify test partition is total and disjoint
        run: ./scripts/ci-test-partition.sh check

      # PRD-mcphost-metered-overage AC9. `metering_ac09_deploy_units_verify`
      # runs `systemd-analyze verify` on deploy/mcphost-emit-meter.service,
      # whose ExecStart (`%h/.local/bin/mcphost billing emit-meter`) is
      # resolved and checked for an executable file at verify time -- on a
      # runner with no prior install step that path is empty and verify
      # fails with "is not executable: No such file or directory" (run
      # 34078778358), not a metering logic bug. Build once and place the
      # binary at the exact path the unit expects, matching what a real
      # mcphost-1 install does before enabling the timer.
      - name: build mcphost binary for deploy-unit verification
        run: |
          cargo build --locked --bin mcphost
          install -Dm755 target/debug/mcphost "$HOME/.local/bin/mcphost"

      # PRD-mcphost-contract-suite-generated: the `//! contract:` suites first, so a
      # drifted tree-derived set (CHANGELOG, migrations, tools/list shape, weights)
      # fails in minutes with a short log. The list is derived from Cargo.toml.
      - name: contract suites
        run: ./scripts/pin-tests.sh

      - name: cargo test (core suites)
        # CI runners are shared 2-4 vCPU hosts: timing budgets are the gate's
        # truth (RedBaron, quiet box, var unset), not CI's. Same switch the gate
        # flips under load; perf_budget!/perf_skipped() print the skip.
        env:
          MCPHOST_PERF_SKIP: "1"
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo test --locked $(./scripts/ci-test-partition.sh core) -- --nocapture 2>&1 | tee /tmp/cargo-test.log
          status=$?
          echo "core suites wall time: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # `--doc` cannot be combined with any other target selector, so doctests
      # are their own invocation rather than part of either partition.
      - name: cargo test --doc
        run: cargo test --locked --doc

      # PRD-mcphost-ci-sandbox-coverage P0#3, core half. This job deliberately
      # does NOT grant unprivileged user namespaces, so any capability-skip
      # here means `ci-test-partition.sh` filed a userns-dependent target into
      # the core partition -- where it would have passed vacuously forever.
      - name: assert no core suite skipped for capability reasons
        run: |
          skipped=$(grep -c "skipped: no user namespaces" /tmp/cargo-test.log || true)
          executed=$(grep -c '^test .* \.\.\. ok$' /tmp/cargo-test.log || true)
          echo "core non-vacuous check: skipped=$skipped executed-ok=$executed"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped core-partition test(s) skipped for user-namespace reasons. A userns-dependent target is misfiled into the core partition -- it needs the sandbox job's capability grant. See scripts/ci-test-partition.sh."
            exit 1
          fi
          if [ "$executed" -eq 0 ]; then
            echo "::error::cargo test reported zero executed ('... ok') tests -- the core suites did not run at all."
            exit 1
          fi

      - name: cargo deny check
        run: cargo deny --locked check

      - name: bad-rust audit
        run: ./scripts/audit.sh

      # Informational: live branch protection vs .github/required-checks.toml.
      # The default GITHUB_TOKEN usually cannot read protection (needs admin);
      # a permission error prints a skip line and never fails the job.
      - name: required checks match branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          ./scripts/required-checks.sh --check || rc=$?
          case "$rc" in
            0) ;;
            2) echo "required-checks: skipped (no permission)" ;;
            *) echo "::warning::branch protection differs from .github/required-checks.toml (see above); an admin runs scripts/required-checks.sh --apply" ;;
          esac

  sandbox:
    name: sandbox suites (user namespaces, shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: install rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.10.1

      - name: install bubblewrap and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # PRD-mcphost-ci-sandbox-coverage. Ubuntu 24.04 runner images restrict
      # unprivileged CLONE_NEWUSER via AppArmor by default
      # (kernel.apparmor_restrict_unprivileged_userns=1), which makes both
      # `bwrap` and `unshare -Urn` fail even with the binaries installed --
      # the sandbox suites' capability probe (`sandbox::supports_user_namespaces`)
      # then genuinely reports "unavailable" and every sandbox test skips via
      # `require_user_namespaces_or_ci_skip`'s CI branch, so a green run never
      # actually exercised the isolation code. This step grants the capability
      # for real, runner-session-only and reversible (the runner VM is
      # destroyed after the job either way). Best-effort (`|| true`): a
      # forked-PR job or a future image without this sysctl must still run
      # rather than hard-fail here -- the non-vacuous assertion step below is
      # what actually catches a runner that can't do this.
      - name: enable unprivileged user namespaces for the sandbox suites
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: verify test partition is total and disjoint
        run: ./scripts/ci-test-partition.sh check

      - name: cargo test (sandbox suites, shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }})
        # CI runners are shared 2-4 vCPU hosts: timing budgets are the gate's
        # truth (RedBaron, quiet box, var unset), not CI's. Same switch the gate
        # flips under load; perf_budget!/perf_skipped() print the skip.
        env:
          MCPHOST_PERF_SKIP: "1"
        run: |
          set -o pipefail
          shard=${{ matrix.shard }}
          total=${{ needs.plan.outputs.shards }}
          flags=$(./scripts/ci-test-partition.sh sandbox-shard "$shard" "$total")
          # Build and run are timed apart: only the run is budgeted (AC3),
          # compile time is reported (scripts/ci-shard-report.sh).
          start=$(date +%s)
          cargo test --no-run $flags
          build_s=$(( $(date +%s) - start ))
          start=$(date +%s)
          cargo test $flags -- --nocapture 2>&1 | tee /tmp/cargo-test.log
          status=$?
          run_s=$(( $(date +%s) - start ))
          ./scripts/ci-shard-report.sh "$shard" "$total" "$build_s" "$run_s" /tmp/cargo-test.log "$status"

      # PRD-mcphost-ci-sandbox-coverage P0#3. `require_user_namespaces_or_ci_skip`
      # skips cleanly (does not fail the test binary) whenever CI lacks the
      # capability, which means a runner image regression that silently drops
      # userns support would otherwise still show cargo test's own summary as
      # all-green. Fail the job explicitly instead: any sandbox test that
      # printed its "skipped: no user namespaces" line means the suites did
      # not run for real this time, and that must turn CI red, not stay green.
      # The grepped literal is `sandbox::USERNS_SKIP_MARKER`; the Rust side is
      # pinned to it by tests/ci_sandbox_ac03_*.rs.
      - name: assert sandbox suites executed for real (non-vacuous)
        run: |
          skipped=$(grep -c "skipped: no user namespaces" /tmp/cargo-test.log || true)
          executed=$(grep -c '^test .* \.\.\. ok$' /tmp/cargo-test.log || true)
          echo "sandbox suite non-vacuous check: skipped=$skipped total-executed-ok=$executed"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped sandbox test(s) skipped for capability reasons on a runner that this workflow just granted unprivileged user namespaces to -- the sandbox suites did not run for real. See PRD-mcphost-ci-sandbox-coverage."
            exit 1
          fi
          if [ "$executed" -eq 0 ]; then
            echo "::error::cargo test reported zero executed ('... ok') tests -- the suite did not run at all."
            exit 1
          fi

  # PRD-mcphost-ci-sandbox-coverage AC6. `sandbox` is a matrix, and a
  # matrix job failing does not by itself fail the workflow unless some other
  # job depends on it -- GitHub reports the run red only because THIS job
  # reads `needs.sandbox.result`. `if: always()` makes it run even when a
  # shard failed (the default `if` would skip it, and a skipped required job
  # reads as "not failed" to some branch-protection configurations).
  sandbox-required:
    name: sandbox suites (all shards)
    needs: sandbox
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if any sandbox shard did not succeed
        run: |
          echo "sandbox matrix result: ${{ needs.sandbox.result }}"
          if [ "${{ needs.sandbox.result }}" != "success" ]; then
            echo "::error::one or more sandbox matrix shards did not succeed (result=${{ needs.sandbox.result }}) -- see the sandbox job's shard runs above."
            exit 1
          fi

  # PRD-mcphost-test-suite-flake-lints requirement 4. No `needs:` on `gate`/
  # `sandbox` -- it's a plain bash/grep/awk scan over tests/**/*.rs (no
  # Rust toolchain needed), so it runs concurrently with them rather than
  # adding to the workflow's wall time. `scripts/risk-gate.sh` runs this
  # same script for wm-build's own gate (that invocation lives in the
  # harness-readonly skill script risk-gate.sh execs, not in this repo).
  flake-lint:
    name: flake-lint (env-mutation, single-shot-perf, receipt-read)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: scripts/flake-lint.sh tests
        run: ./scripts/flake-lint.sh tests

      # PRD-mcphost-healthz-anon-keys-const requirement 4.
      - name: scripts/healthz-keys-lint.py tests
        run: python3 scripts/healthz-keys-lint.py tests

      # PRD-mcphost-child-process-test-harness R6 (AC7). Stdlib python3 on
      # the runner image; fails naming file:line for any raw `serve` spawn,
      # live-pipe read or hand-rolled child guard in tests/, before any
      # job that installs a Rust toolchain has a chance to start.
      - name: scripts/child-proc-lint.py tests
        run: python3 scripts/child-proc-lint.py tests

      # PRD-mcphost-timing-assertion-lint: the same scanner the core suites
      # run (flakelint_ac07); stdlib python, no toolchain.
      - name: scripts/timing-lint.py tests
        run: python3 -I scripts/timing-lint.py tests

  # PRD-mcphost-docs-external-links-resolve R5 (AC7). Every external link in
  # README.md, docs/**, www/llms.txt and plugin/** must resolve; a PR that
  # adds a 404 fails here and the log carries `FAIL <status> <url>
  # <file>:<line>`. Python stdlib + the runner's network only: no Rust
  # toolchain, no sandbox partition, no `needs:` -- it runs concurrently with
  # the other jobs and finishes in seconds (budget: 60 s). The client-block
  # drift check needs the mcphost binary, so it is its own job below and
  # never slows this one.
  docs:
    name: docs external links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: scripts/docs-link-check.sh
        run: ./scripts/docs-link-check.sh

  # R5, second half: README.md's and www/llms.txt's `<!-- clients:start/end
  # -->` blocks are the render of docs/clients.toml. Needs the binary, so it
  # builds it; no `needs:`, no sandbox partition.
  docs-clients:
    name: docs client blocks match docs/clients.toml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.10.1

      - name: mcphost llms-txt --check
        run: cargo run --quiet --bin mcphost -- llms-txt --check

  # Defect (10-03): a dependency bump (wasmtime 48 / cranelift 0.135, needing
  # rustc 1.95) landed on main while `rust-version` in Cargo.toml stayed at
  # 1.94. `gate` and `sandbox` both build with the toolchain pinned in
  # rust-toolchain.toml (always >= the declared rust-version, since that's
  # the toolchain actually used for development), so neither noticed -- CI
  # stayed green for hours and only wm-build's own `msrv-verify` gate caught
  # the mismatch, blocking every land. This job closes that gap on every PR:
  # it reads the declared `rust-version` straight from Cargo.toml and builds
  # with EXACTLY that toolchain, so a PR whose dependencies need a newer
  # rustc than it declares fails here instead of silently passing `gate`.
  # No `needs:` -- runs concurrently with the other jobs.
  msrv:
    name: msrv check (builds with the declared rust-version toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: read declared rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
          if [ -z "$v" ]; then
            echo "::error::could not read a rust-version from Cargo.toml's [package] table"
            exit 1
          fi
          echo "declared rust-version: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Same action already used by `gate`/`sandbox` above, just pointed at
      # the declared version instead of rust-toolchain.toml's channel -- this
      # reuses its built-in cargo cache rather than adding a new one.
      - name: install the declared rust-version toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.10.1
        with:
          toolchain: ${{ steps.msrv.outputs.v }}

      - name: cargo check --locked --all-targets with the declared MSRV
        run: cargo check --locked --all-targets

  # Derived-contract regeneration checks (the wm-build gate's `repo:*` checks).
  # Every generator runs in its CHECK mode and the job reports ALL stale files
  # before failing, so a branch whose generated files drifted from their sources
  # goes red here the way the gate would, instead of landing on main and failing
  # every later PR (df738f5 left tests/suite_core_07/08.rs stale: gen-test-suites
  # --check was only run by the gate). Add a new generator's check to the list.
  regen-check:
    name: regen-check (generated files match their sources)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.10.1

      # Several checks (sandbox-api-doc-check, gen-llms-full) run the binary;
      # build it once so they use target/debug/mcphost instead of `cargo run`.
      - name: build mcphost binary for the generator checks
        run: cargo build --locked --bin mcphost

      - name: every generator in check mode
        run: |
          failed=0
          check() {
            echo "::group::$*"
            if "$@"; then
              echo "ok: $*"
            else
              echo "::error::stale generated file(s): $* (regenerate with the script's write mode and commit)"
              failed=1
            fi
            echo "::endgroup::"
          }
          check ./scripts/gen-test-suites.sh --check
          check ./scripts/ci-test-partition.sh check
          check ./scripts/contract-lint.sh
          check ./scripts/gen-docs-sharing.sh --check
          check ./scripts/gen-oauth-scenarios-doc.sh --check
          check ./scripts/protocol-frames-check.sh --check
          check ./scripts/heal-doc-check.sh
          check ./scripts/host-pressure-doc-check.sh
          check ./scripts/spec-fields-doc-check.sh
          check ./scripts/sandbox-api-doc-check.sh
          check ./scripts/skill-gen-check.sh
          check ./scripts/gen-llms-full.sh --check
          # .github/required-checks.toml is the render of the workflow files.
          check bash -c 'diff <(./scripts/required-checks.sh --print) .github/required-checks.toml'
          exit "$failed"

      # Informational until README.md / www/llms.txt are regenerated on main:
      # gen-agent-docs --check was already stale before this job existed
      # (docs/agent-quickstart.md moved ahead of its two rendered blocks).
      - name: gen-agent-docs --check (informational)
        run: |
          ./scripts/gen-agent-docs.sh --check || echo "::warning::README.md / www/llms.txt are stale against docs/agent-quickstart.md (scripts/gen-agent-docs.sh regenerates them)"

  # Backs wm-build's `determinism` gate producer (CI-as-gate, 10-10).
  # Mirrors autobuilder extended-gates producers/determinism.rs: two cold
  # `cargo build --release` runs, identical artifact sha256. No cache on purpose.
  determinism:
    # required-checks: exclude -- 50 min of two cold release builds; the gate reads
    # its receipt by sha, it is not a merge-blocking context.
    name: determinism (two cold release builds, identical artifact sha256)
    # 2026-10-11: main-only. Two cold release builds take 20-40 min on a hosted
    # runner; the job is not a required check, yet every land waited for it
    # before tagging (wm-build red leg 60). The gate runs determinism in its
    # nightly tier; CI keeps it on main pushes so drift still surfaces daily.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: show active toolchain
        run: rustup show active-toolchain

      - name: two cold release builds, compare artifact sha256
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$(mktemp -d)"
          export CARGO_TARGET_DIR
          # Same selection as collect_release_bins: regular files directly under
          # release/ with no extension (a leading dot alone is not one) or .rlib.
          hash_release() {
            (
              cd "$CARGO_TARGET_DIR/release" 2>/dev/null || exit 0
              find . -maxdepth 1 -type f \( -name '*.rlib' -o -regex '\./\.?[^.]*' \) -print0 \
                | LC_ALL=C sort -z | xargs -0 -r sha256sum
            )
          }
          cargo -q clean
          cargo -q build --release
          hash_release > "$RUNNER_TEMP/run_a.txt"
          cargo -q clean
          cargo -q build --release
          hash_release > "$RUNNER_TEMP/run_b.txt"
          echo "== run A =="; cat "$RUNNER_TEMP/run_a.txt"
          echo "== run B =="; cat "$RUNNER_TEMP/run_b.txt"
          n=$(wc -l < "$RUNNER_TEMP/run_a.txt")
          # Artifacts of run A that are missing or differ in run B.
          m=$(diff <(cat "$RUNNER_TEMP/run_a.txt") <(cat "$RUNNER_TEMP/run_b.txt") | grep -c '^<' || true)
          # Artifacts only present in run B also count as a differing set.
          extra=$(diff "$RUNNER_TEMP/run_a.txt" "$RUNNER_TEMP/run_b.txt" | grep -c '^>' || true)
          if [ "$m" -eq 0 ] && [ "$extra" -ne 0 ]; then m=$extra; fi
          msg="determinism: $n artifacts, $m mismatched"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then echo "::error::no release artifacts collected"; exit 1; fi
          if [ "$m" -ne 0 ]; then diff "$RUNNER_TEMP/run_a.txt" "$RUNNER_TEMP/run_b.txt" || true; exit 1; fi
