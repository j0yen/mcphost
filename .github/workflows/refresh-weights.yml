# refresh-weights -- after a green push CI run on main, re-measure the suite weights from that run's logs
# and open ONE auto-merging PR (ci: refresh suite weights from run <id>) when scripts/ci-suite-weights.json,
# scripts/ci-suite-measured.json or the generated suites change. Without it a `_provisional` pending entry
# turns main red by commit count (scripts/ci-test-partition.sh PENDING_MAX_AGE) until a hand run.
# Not a required check (no push/pull_request trigger): its failure is visible without reddening main.
# The PR is pushed with MCPHOST_BOT_TOKEN, never GITHUB_TOKEN: a GITHUB_TOKEN PR runs no CI.
name: refresh-weights

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id whose shard logs to measure (manual re-measure)"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-weights
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: require the bot token
        env:
          MCPHOST_BOT_TOKEN: ${{ secrets.MCPHOST_BOT_TOKEN }}
        run: |
          if [ -z "$MCPHOST_BOT_TOKEN" ]; then
            echo "::error::MCPHOST_BOT_TOKEN missing"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.MCPHOST_BOT_TOKEN }}
      - name: measure and regenerate
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.MCPHOST_BOT_TOKEN }}
        run: |
          result="$(scripts/ci-refresh-weights-auto.sh "$SOURCE_RUN_ID")"
          echo "$result"
          case "$result" in
            "changed=1 skip=none") echo "changed=1" >> "$GITHUB_OUTPUT" ;;
            "changed=0 skip="*) echo "changed=0" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected result line: $result"; exit 1 ;;
          esac
      - name: publish the refresh PR
        if: steps.refresh.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.MCPHOST_BOT_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          branch="ci/refresh-weights-${SOURCE_RUN_ID}"
          title="ci: refresh suite weights from run ${SOURCE_RUN_ID}"
          git config user.name "mcphost-bot"
          git config user.email "mcphost-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- scripts/ci-suite-weights.json scripts/ci-suite-measured.json tests/ Cargo.toml
          git commit -m "$title"
          git push origin "$branch"
          # one open refresh PR at a time: supersede any older one before opening this one
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ci/refresh-weights-")) | .number' |
            while read -r n; do
              gh pr close "$n" --comment "superseded by run ${SOURCE_RUN_ID}"
            done
          body="Source CI run: ${SOURCE_RUN_ID}
          Measured at main head: ${head_sha}

          Generated by scripts/ci-refresh-weights-auto.sh (ci-refresh-weights.sh, gen-test-suites.sh, ci-test-partition.sh check all passed before this push)."
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
          gh pr merge "$branch" --auto --squash
