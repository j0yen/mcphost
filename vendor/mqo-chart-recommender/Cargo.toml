[package]
name = "mqo-chart-recommender"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Picks a chart mark and encoding from a result-profile.v1 inventory -- vendored by mcphost, PRD-mcphost-chart-in-a-minute."
publish = false

[lib]
name = "mqo_chart_recommender"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mqo-chart-vocab = { path = "../mqo-chart-vocab", version = "0.1.0" }
