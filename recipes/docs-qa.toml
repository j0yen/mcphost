title = "Docs Q&A in a minute"
llms_section = "Docs Q&A in a minute"
llms_insert_after = "Health is unauthenticated at `GET /healthz`."
plan_fit = "free"
registry = "python"
tenants = ["owner"]

[budget]
calls = 6
wall_s = 90

[[steps]]
tool = "host.docs.put"
args = { name = "vpn-setup.md", content = "# VPN setup\n\nThe VPN client connects on port 1194 over UDP.\n" }

[[steps]]
tool = "host.docs.put"
args = { name = "onboarding.md", content = "# Onboarding\n\nOn day one you receive a laptop and a badge.\n" }

[[steps]]
tool = "host.docs.status"
args = {}
retry_s = 45
note = "poll until index.lag_seconds == 0"
expect = [{ path = "$.index.lag_seconds", value = 0 }]

[[steps]]
tool = "host.tool_publish"
args = { name = "ask_docs", kind = "python", spec = { source = "${file:examples/docs-qa/ask_docs.py}" } }

[[steps]]
tool = "host.tool_call"
args = { name = "ask_docs", args = { query = "What port does the VPN client connect on?", k = 5 } }
retry_s = 45
note = "every passage carries a name:offset citation"
expect = [{ path = "$.passages[0].name", value = "vpn-setup.md" }]

[task]
header = '''
# Consumer task for the synthorg mcphost corpus
# (~/repos/synthorg/corpora/mcphost/consumer-tasks.yaml, see its own header
# comment for the id/segments/task/gold schema and the call_check
# mini-grammar). Unlike the other examples/*/synthorg-task.yaml files in
# this repo (each a *proposed*, not-merged block, since their PRDs predate
# this one), this task was actually merged into that corpus by
# PRD-mcphost-docs-qa-recipe requirement 5 -- this copy is kept here too,
# byte-identical in its `task`/`gold` shape, so a future edit to one side
# doesn't silently drift from the other unnoticed
# (tests/docsqa_ac06_synthorg_task_matches_gold_question_3.rs checks this
# copy's own shape against examples/docs-qa/corpus/gold.json's question 3).
#
# Segment: rag_indexer (incumbent: LlamaIndex). This segment's other tasks
# in the real corpus check that document-store primitives exist (ingestion
# status, retrieval latency); this one instead proves the persona can
# finish mcphost's "Docs Q&A in a minute" recipe end to end -- publish a
# search tool, ask a real question, get the right document back. Scored via
# a dedicated synthorg.fixtures route (`/docs/search/{question_id}`,
# `_build_docs_search`) seeded so `question-3` always ranks `vpn-setup.md`
# first, the same question/document pairing this repo's own
# examples/docs-qa/corpus/gold.json question 3 uses.
'''
id = "docs_qa_recipe"
segments = ["rag_indexer"]
text = '''
      You do not trust a document store until it actually answers a
      question correctly. Sign up, publish an http-kind tool named
      `ask_docs` that wraps `{{fixture_base}}/docs/search/question-3` to
      search a small seeded corpus, and call it with the corpus's own third
      gold question ("What port does the VPN client connect on?") — the
      result's top 5 hits should include the document that actually answers
      it, `vpn-setup.md`.
'''
fixture_route = "/docs/search/question-3"

[task.gold]
tool_name = "ask_docs"
call_check = "result.payload contains vpn-setup.md"
kind = "http"

[proof]
body = '''
# proof.sh -- runnable end-to-end proof of "Docs Q&A in a minute"
# (see www/llms.txt). A thin wrapper over docs-qa.sh, which uploads the
# 8-document corpus, waits for the index, publishes ask_docs and asks the
# 6 gold questions against $MCPHOST_URL.
#
# Env vars:
#   MCPHOST_URL   the endpoint to run the recipe against.
#                 Default: https://mcphost.dev/mcp
#
# Exit code 0 iff docs-qa.sh exits 0.

set -uo pipefail
cd "$(dirname "$0")"

MCPHOST_URL="${MCPHOST_URL:-https://mcphost.dev/mcp}"
exec bash ./docs-qa.sh "$MCPHOST_URL"
'''