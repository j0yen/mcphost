title = "Uptime probes with no server"
llms_section = "Uptime probes with no server"
plan_fit = "free"
registry = "http"
tenants = ["owner"]

[budget]
calls = 3
wall_s = 60

[[fixture_routes]]
method = "GET"
path = "/health"
status = 200
body = "ok"

[[steps]]
tool = "host.uptime.create"
args = { name = "status", urls = ["${fixture_base}/health", "${fixture_base}/health?second=1"] }
note = "creates the probe set, a status tool and one schedule, and probes once"
expect = [{ path = "$.status_tool", value = "status" }, { path = "$.schedule_id", exists = true }, { path = "$.first_result.rows[0].ok", value = true }]

[[steps]]
tool = "host.tool_call"
args = { name = "status", args = {} }
note = "reads the last stored result, never fetches live"

[task]
header = '''
# Consumer task for the synthorg mcphost corpus (RedBaron's
# corpora/mcphost/consumer-tasks.yaml, see its own header comment for the
# id/segments/task/gold schema and the call_check mini-grammar). Proposed
# addition for the "Uptime probes with no server" recipe (www/llms.txt,
# examples/uptime-probes/proof.sh) -- not merged into that file by this
# PRD, since RedBaron's corpus lives in a separate repository outside this
# worktree's scope (build_into: mcphost only). A maintainer of that corpus
# can fold this block into consumer-tasks.yaml's own `tasks:` list.
#
# Segment: ops_coordinator (incumbent: a monitoring SaaS account, or a
# polling box that is itself unmonitored). This task proves the
# alternative: one schedule, one table, one tool -- scored on reaching the
# first stored check (PRD success metric: "time to first stored check").
'''
id = "ops-coordinator-uptime-probes-no-server"
segments = ["ops_coordinator"]
text = '''
      Your team runs a couple of small services and wants to know when
      one goes down, without a monitoring SaaS account or an unmonitored
      box polling for it. Sign up, create `targets` and `checks` tables
      with `host.state.table_create` (`targets`: url text primary key,
      added_at real; `checks`: url text, code integer, ms real, at real),
      add one target URL to `targets` with `host.state.insert`, publish
      `probe` as a `python` tool with `network: "public"` that fetches
      every target and writes one `checks` row per target, and call it --
      the result should show `probed: 1`.
'''

[task.gold]
tool_name = "probe"
call_check = "result.probed == 1"
kind = "python"

[proof]
body = '''
# proof.sh -- runnable end-to-end proof of "Uptime probes with no server"
# (see www/llms.txt) on the time-series route (PRD-mcphost-timeseries-buckets
# R6). One fresh tenant against $MCPHOST_URL: three targets (two healthy, one
# that returns 503) in the `targets` key, `probe` published and scheduled,
# `host.trigger.fire` twice instead of waiting 5 minutes, asserting that each
# target now holds two points in each of the `up` and `latency_ms` series
# (`host.ts.get`), then planting the result a reachable network would have
# produced (one `up` point per target, 0 for the 503 one) and asserting that
# `status` -- which reads `host.ts.get` and nothing else -- reports exactly
# that one target down. The last line is
# `status: down=<n> up=<n> via host.ts.get`.
#
# Requires: bash, curl, python3. Deliberately has no jq dependency.
#
# Env vars:
#   MCPHOST_URL     the endpoint to run the recipe against.
#                   Default: https://mcphost.dev/mcp
#   HEALTHY_URL     a URL that returns 2xx. Default: https://httpbin.org/status/200
#   SECOND_URL      a second URL that returns 2xx. Default: https://httpbin.org/status/204
#   DOWN_URL        a URL that returns a non-2xx status. Default: https://httpbin.org/status/503
#   PROBE_NETWORK   the `network` the probe tool is published with.
#                   Default: none (works on the free plan). `public` is
#                   `plan: pro`: a free tenant is refused with
#                   `plan_required`; on pro the probe really reaches
#                   the URLs. With `none` the probe cannot reach any of them,
#                   so it records `up` 0 for every target; the planted points
#                   (newer, same minute) are what `status` then reports.
#
# Exit code 0 iff every check below passes.

set -uo pipefail
cd "$(dirname "$0")"

MCPHOST_URL="${MCPHOST_URL:-https://mcphost.dev/mcp}"
PROBE_NETWORK="${PROBE_NETWORK:-none}"
HEALTHY_URL="${HEALTHY_URL:-https://httpbin.org/status/200}"
SECOND_URL="${SECOND_URL:-https://httpbin.org/status/204}"
DOWN_URL="${DOWN_URL:-https://httpbin.org/status/503}"
FAILURES=0
START_EPOCH=$(python3 -c 'import time; print(time.time())')

check() {
  local desc="$1" ok="$2"
  if [[ "$ok" == "1" ]]; then
    echo "CHECK ${desc}: PASS"
  else
    echo "CHECK ${desc}: FAIL"
    FAILURES=$((FAILURES + 1))
  fi
}

# ---- MCP JSON-RPC helpers (curl + python3) ---------------------------------

mcp_call() {
  # mcp_call <tool> <args_json> [bearer_key] [extra_header_name] [extra_header_value]
  local tool="$1" args="$2" key="${3:-}" hname="${4:-}" hval="${5:-}"
  local body
  body=$(python3 - "$tool" "$args" <<'PY'
import json, sys
print(json.dumps({
    "jsonrpc": "2.0",
    "id": 1,
    "method": "tools/call",
    "params": {
        "name": sys.argv[1],
        "arguments": json.loads(sys.argv[2]),
        # SEP-2575: this host runs every request stateless (no
        # `initialize` handshake to remember client context from), so
        # every `tools/call` must carry it itself.
        "_meta": {
            "io.modelcontextprotocol/protocolVersion": "2026-07-28",
            "io.modelcontextprotocol/clientCapabilities": {},
            "io.modelcontextprotocol/clientInfo": {
                "name": "uptime-probes-proof",
                "version": "1.0.0",
            },
        },
    },
}))
PY
  )
  local -a hdrs=(
    -H "Content-Type: application/json"
    -H "Accept: application/json, text/event-stream"
    -H "MCP-Protocol-Version: 2026-07-28"
    -H "Mcp-Method: tools/call"
    -H "Mcp-Name: ${tool}"
  )
  [[ -n "$key" ]] && hdrs+=(-H "Authorization: Bearer ${key}")
  [[ -n "$hname" ]] && hdrs+=(-H "${hname}: ${hval}")
  local raw
  raw=$(curl -sS --connect-timeout 5 --max-time 30 -X POST "$MCPHOST_URL" "${hdrs[@]}" -d "$body")
  # PRD-mcphost-one-next-tool requirement 3: a call that binds this
  # connection (signup) now emits notifications/tools/list_changed before
  # its own result, which upgrades that one response from a plain JSON
  # body to a text/event-stream one (one "data: <json>" line per message,
  # blocks separated by a blank line) -- normalize back to the plain
  # final JSON-RPC message here so every caller below keeps reading a
  # single JSON object either way.
  python3 - "$raw" <<'PYEOF'
import sys
raw = sys.argv[1]
if raw.lstrip().startswith("data:"):
    last = None
    for block in raw.split("\n\n"):
        for line in block.splitlines():
            if line.startswith("data: "):
                last = line[len("data: "):]
            elif line.startswith("data:"):
                last = line[len("data:"):]
    print(last if last is not None else raw)
else:
    print(raw)
PYEOF
}

# error_code_of <raw_json> -- prints error.data.error_code, or empty.
error_code_of() {
  python3 - "$1" <<'PY'
import json, sys
d = json.loads(sys.argv[1])
err = d.get("error") or {}
print((err.get("data") or {}).get("error_code", ""))
PY
}

structured_of() {
  python3 - "$1" <<'PY'
import json, sys
body = json.loads(sys.argv[1])
if "error" in body:
    print(json.dumps({"__error__": body["error"]}))
    sys.exit(0)
result = body.get("result") or {}
sc = result.get("structuredContent")
if sc is not None:
    print(json.dumps(sc))
    sys.exit(0)
content = result.get("content") or []
if content and isinstance(content[0], dict) and "text" in content[0]:
    print(content[0]["text"])
    sys.exit(0)
print("null")
PY
}

json_str() {
  # json_str <json> <dotted.path> -- prints the raw string at that path, or
  # empty if missing/not-a-string.
  python3 - "$1" "$2" <<'PY'
import json, sys
d = json.loads(sys.argv[1])
for p in [p for p in sys.argv[2].split(".") if p]:
    d = d.get(p) if isinstance(d, dict) else None
print(d if isinstance(d, str) else "")
PY
}

has_error() {
  python3 - "$1" <<'PY'
import json, sys
sys.exit(0 if "error" in json.loads(sys.argv[1]) else 1)
PY
}

# wait_for_run <run_id> <key> -- polls host.runs.get until the run leaves
# queued/running, printing its final structured JSON.
wait_for_run() {
  local run_id="$1" key="$2"
  local args resp status
  args=$(python3 -c 'import json,sys; print(json.dumps({"run_id": sys.argv[1]}))' "$run_id")
  for _ in $(seq 1 200); do
    resp=$(mcp_call "host.runs.get" "$args" "$key")
    status=$(json_str "$(structured_of "$resp")" "status")
    if [[ "$status" != "queued" && "$status" != "running" ]]; then
      structured_of "$resp"
      return
    fi
    sleep 0.1
  done
  structured_of "$resp"
}

# ---- the recipe -------------------------------------------------------------

SYNTHETIC_HEADER="recipe:uptime-probes"

# 1. One fresh tenant, tagged so this proof's own signup is distinguishable
#    from real recipe traffic (requirement 5).
signup_resp=$(mcp_call "signup" '{"name": "uptime-probes-owner"}' "" "x-mcphost-synthetic" "$SYNTHETIC_HEADER")
signup_struct=$(structured_of "$signup_resp")
NS=$(json_str "$signup_struct" "tenant")
KEY=$(json_str "$signup_struct" "key")
check "tenant_signed_up" "$([[ -n "$KEY" ]] && echo 1 || echo 0)"
echo "NS=${NS}"

# 2. Three targets in the `targets` key: two healthy, one that returns 503.
targets_args=$(python3 -c 'import json,sys; print(json.dumps({"key": "targets", "value": sys.argv[1:]}))' "$HEALTHY_URL" "$SECOND_URL" "$DOWN_URL")
targets_resp=$(mcp_call "host.state.set" "$targets_args" "$KEY")
check "targets_set" "$(has_error "$targets_resp" && echo 0 || echo 1)"

# 3. Publish probe (python, network: $PROBE_NETWORK -- `none` on the free
#    plan, `public` is plan: pro) and status (python).
PROBE_SRC=$(cat tools/probe.py)
publish_args=$(python3 -c 'import json,sys; print(json.dumps({"name":"probe","kind":"python","spec":{"source": sys.argv[1], "network": sys.argv[2]}}))' "$PROBE_SRC" "$PROBE_NETWORK")
echo "PROBE_NETWORK=${PROBE_NETWORK}"
publish_resp=$(mcp_call "host.tool_publish" "$publish_args" "$KEY")
check "publish_probe" "$(has_error "$publish_resp" && echo 0 || echo 1)"

STATUS_SRC=$(cat tools/status.py)
publish_args=$(python3 -c 'import json,sys; print(json.dumps({"name":"status","kind":"python","spec":{"source": sys.argv[1]}}))' "$STATUS_SRC")
publish_resp=$(mcp_call "host.tool_publish" "$publish_args" "$KEY")
check "publish_status" "$(has_error "$publish_resp" && echo 0 || echo 1)"

# status reads host.ts.get and nothing else: no state.query / state.insert in it.
check "status_source_has_no_state_query" "$([[ "$(grep -cE 'state\.(query|insert)' tools/status.py)" == "0" ]] && echo 1 || echo 0)"

# 4. Schedule probe every 5 minutes (the free plan's floor), then fire it
#    twice instead of waiting 10 minutes -- a real user just waits.
set_resp=$(mcp_call "host.trigger.set" '{"tool": "probe", "kind": "schedule", "schedule": "*/5 * * * *"}' "$KEY")
check "trigger_set" "$(has_error "$set_resp" && echo 0 || echo 1)"
TRIGGER_ID=$(json_str "$(structured_of "$set_resp")" "id")

fire_args=$(python3 -c 'import json,sys; print(json.dumps({"id": sys.argv[1]}))' "$TRIGGER_ID")
for i in 1 2; do
  fire_resp=$(mcp_call "host.trigger.fire" "$fire_args" "$KEY")
  run_id=$(json_str "$(structured_of "$fire_resp")" "run_id")
  run_struct=$(wait_for_run "$run_id" "$KEY")
  run_status=$(json_str "$run_struct" "status")
  check "probe_fire_${i}_succeeds" "$([[ "$run_status" == "done" ]] && echo 1 || echo 0)"
done

# points_of <series> <url> -- how many points the series holds for the url
# over the last 24 h, counted from host.ts.get (one day-wide bucket per call).
points_of() {
  local args resp
  args=$(python3 -c 'import json,sys; print(json.dumps({"series": sys.argv[1], "bucket": "1d", "from": "-24h", "tags": {"url": sys.argv[2]}}))' "$1" "$2")
  resp=$(structured_of "$(mcp_call "host.ts.get" "$args" "$KEY")")
  python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(sum(b.get("count", 0) for b in d.get("buckets") or []))' "$resp"
}

# 5. Two points per target in each series -- the probe wrote them, not rows.
for u in "$HEALTHY_URL" "$SECOND_URL" "$DOWN_URL"; do
  check "target_has_two_up_points" "$([[ "$(points_of up "$u")" == "2" ]] && echo 1 || echo 0)"
  check "target_has_two_latency_points" "$([[ "$(points_of latency_ms "$u")" == "2" ]] && echo 1 || echo 0)"
done

# 6. Plant the outcome a reachable network gives: one newer `up` point per
#    target, 1 for the healthy ones and 0 for the one that returns 503.
for pair in "${HEALTHY_URL}|1" "${SECOND_URL}|1" "${DOWN_URL}|0"; do
  put_args=$(python3 -c 'import json,sys; u,v=sys.argv[1].rsplit("|",1); print(json.dumps({"series": "up", "value": int(v), "tags": {"url": u}}))' "$pair")
  put_resp=$(mcp_call "host.ts.put" "$put_args" "$KEY")
  check "planted_up_point" "$(has_error "$put_resp" && echo 0 || echo 1)"
done

# 7. status, answered from host.ts.get alone: the 503 target is down with a
#    down_since, the other two are up.
status_resp=$(mcp_call "${NS}.status" '{}' "$KEY")
status_struct=$(structured_of "$status_resp")
read -r STATUS_DOWN STATUS_UP < <(python3 -c 'import json,sys; ts=json.loads(sys.argv[1]).get("targets") or []; print(sum(1 for t in ts if t.get("up") is False), sum(1 for t in ts if t.get("up") is True))' "$status_struct")
STATUS_DOWN="${STATUS_DOWN:-0}"; STATUS_UP="${STATUS_UP:-0}"
DOWN_ENTRY_UP=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); t=[x for x in d.get("targets") or [] if x.get("url")==sys.argv[2]]; print(t[0].get("up") if t else "")' "$status_struct" "$DOWN_URL")
check "planted_down_url_is_down" "$([[ "$DOWN_ENTRY_UP" == "False" ]] && echo 1 || echo 0)"
DOWN_SINCE=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); t=[x for x in d.get("targets") or [] if x.get("url")==sys.argv[2]]; print(t[0].get("down_since","") if t else "")' "$status_struct" "$DOWN_URL")
check "down_url_has_down_since" "$([[ -n "$DOWN_SINCE" ]] && echo 1 || echo 0)"
check "status_reports_down_1_up_2" "$([[ "$STATUS_DOWN" == "1" && "$STATUS_UP" == "2" ]] && echo 1 || echo 0)"

END_EPOCH=$(python3 -c 'import time; print(time.time())')
WALL_MS=$(python3 -c "print(int((${END_EPOCH} - ${START_EPOCH}) * 1000))")
echo "WALL_TIME_MS=${WALL_MS}"

if [[ "$FAILURES" -eq 0 ]]; then
  echo "RESULT: PASS"
  RC=0
else
  echo "RESULT: FAIL (${FAILURES} check(s) failed)"
  RC=1
fi
echo "status: down=${STATUS_DOWN:-0} up=${STATUS_UP:-0} via host.ts.get"
exit "$RC"
'''